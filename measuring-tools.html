ne-size}\n@media (max-width:560px){ .fx-eq{display:grid;grid-template-columns:1fr 1fr;gap:14px 6px} .fx-op{display:none} .fx-chip.total{grid-column:1 / -1} .fx-hero{padding:11px 12px;gap:10px} .fx-head h4{font-size:16px} .fx-num b{font-size:22px} }\n.flat{position:absolute;right:12px;bottom:12px;background:#0b0c0e;border:1px solid #2a2d31;border-radius:10px;padding:8px;z-index:2}\n.flat-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px 2px}\n.flat-h span{font-size:12px;font-weight:600;color:var(--ink)}\n/* #view canvas stretches the 3D canvas to fill the view; the flat view keeps its own size */\n#view .flat canvas{display:block;width:260px;height:280px;border-radius:6px}\n#view .flat.closed canvas,#view .flat.min canvas{display:none}\n.flat.closed #flatCv{display:none}\n.ib.sm{width:28px;height:28px;font-size:13px;border-radius:6px}\n.flat [data-tip]::after{right:0;left:auto;top:auto;bottom:calc(100% + 8px)}\n.flat-dock{display:none}\nbody.exam .flat{display:none!important}\n@media (max-width:700px){\n  .flat-dock{display:block;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px 12px}\n  .flat.docked{position:static;background:none;border:0;border-radius:0;padding:0}\n  .flat.docked canvas{width:100%!important;height:auto!important;max-width:360px;aspect-ratio:260 / 280;margin:0 auto}\n}\n.tut-card ol li b{color:var(--ink)}\n.tut-mouse{font-size:12.5px;color:var(--muted)}\n.tgl{display:flex;align-items:center;gap:8px;width:100%;text-align:left}\n.tgl em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}\n.tgl[aria-pressed=\"true\"] em{color:var(--bg);opacity:.72}\n.tgl{margin:0 0 8px}\n\n/* ---- every button is an outline: a border and colored text, never a filled block ---- */\nbutton,.pgo,.pbtn,.ib{background:transparent!important;border:1px solid #3d4147!important;color:var(--ink)!important;box-shadow:none!important}\nbutton:hover,button:focus-visible{border-color:#8a8f97!important;color:#fff!important}\n/* floating buttons over the 3D view keep a faint see-through backing so they stay readable */\n#view .ib,#view .pbtn,.cine .pbtn{background:rgba(10,11,13,.38)!important;border-color:rgba(255,255,255,.34)!important}\n#view .ib:hover,#view .pbtn:hover,.cine .pbtn:hover{border-color:#fff!important}\nbutton.primary,.pgo:not(.alt){border-color:var(--accent)!important;color:var(--accent)!important}\nbutton[aria-pressed=\"true\"],button[aria-checked=\"true\"],#view .ib[aria-pressed=\"true\"],#view .pbtn[aria-pressed=\"true\"],.cine .pbtn[aria-pressed=\"true\"]{border-color:var(--accent)!important;color:var(--accent)!important}\n#lockBtn[aria-pressed=\"true\"],#bezelLockBtn[aria-pressed=\"true\"],#lockQuick[aria-pressed=\"true\"],button.lock[aria-pressed=\"true\"]{border-color:var(--warn)!important;color:var(--warn)!important}\n.tgl[aria-pressed=\"true\"] em{color:var(--accent)!important;opacity:1!important}\n.fcard.sel{background:transparent!important}\n.fhead,.fhead:hover{border:0!important}\nbutton:disabled{opacity:.4}\n\n/* the side panel and the reading panel fold away, leaving the 3D view the whole window */\nbody.side-off .app{grid-template-columns:minmax(0,1fr)!important;grid-template-areas:\"main\"!important}\nbody.side-off aside{display:none!important}\nbody.panel-off .reading,body.panel-off .split{display:none!important}\n.ib .ic-on{display:none}\n.ib[aria-pressed=\"true\"] .ic-off{display:none}\n.ib[aria-pressed=\"true\"] .ic-on{display:inline-block}\n/* even spacing between every row of buttons */\n.grid2,.grid3{gap:6px!important}\n.tgl{margin:0 0 6px!important}\n.units{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 6px}\n.units button{padding:5px 8px;font-size:12.5px}\n.flat.flat-anim{overflow:hidden}\n.flat.flat-anim #flatCv{display:block!important}\nbody.fold-side .app{overflow:hidden}\nbody.fold-side aside{justify-self:end;overflow:hidden;min-width:0}\nbody.fold-panel .reading{overflow:hidden}\nbody.fold-panel .split{display:none}\n/* the status chips stay on one line, so a longer message doesn't resize the reading bar and shift the cards */\n.rstat .status-chip{display:block;position:relative;padding-left:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.rstat .status-chip::before{position:absolute;left:0;top:calc(50% - 3.5px)}\n/* the reading panel button sits in the bottom-left corner, with the hint moved over beside it */\n.quick{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:2}\n.quick [data-tip]::after{left:0;transform:none}\n.hint{left:56px;max-width:min(520px,calc(100% - 68px))}\nbody.exam .quick{display:none!important}\n/* dark scrollbars everywhere: a slim rounded thumb, inset by a transparent border so it suits any background */\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-track{background:transparent}\n::-webkit-scrollbar-thumb{background:#2c2f34;background-clip:padding-box;border:3px solid transparent;border-radius:999px;min-height:40px;min-width:40px}\n::-webkit-scrollbar-thumb:hover{background-color:#41454c}\n::-webkit-scrollbar-thumb:active{background-color:#555a62}\n::-webkit-scrollbar-corner{background:transparent}\n@supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:#2c2f34 transparent} }\n/* click face to measure: the toggle shows it is on the same way Practice does */\n#faceBtn[aria-pressed=\"true\"]{background:#fff;color:#000;border-color:#fff}\n/* each line of a reading card keeps its height even when it is empty, so the cards never move */\n@media (min-width:481px){ .cell .k,.cell .h,.cell .v{line-height:1.45;min-height:1.45em} }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003caside>\n    \u003cheader class=\"logo\">\n      \u003ch1 class=\"logo-mark\" aria-label=\"Height gage\">\n        \u003cspan class=\"logo-brk\" aria-hidden=\"true\">[\u003c/span>\n        \u003cspan class=\"logo-stack\">\u003cspan>Height\u003c/span>\u003cspan class=\"logo-bot\">Gage\u003c/span>\u003c/span>\n        \u003cspan class=\"logo-brk\" aria-hidden=\"true\">]\u003c/span>\n      \u003c/h1>\n      \u003cdiv class=\"logo-rule\" aria-hidden=\"true\">\u003c/div>\n      \u003cspan class=\"logo-range\">514-103 · 0–12″ / 0–300 mm\u003c/span>\n      \u003cdiv>\u003cbutton class=\"tut-btn\" id=\"tutBtn\" type=\"button\">? Tutorial\u003c/button>\u003c/div>\n      \u003cnav class=\"switch-inst\" aria-label=\"Instruments\">\n        \u003ca href=\"depth-micrometer-trainer.html\">Depth micrometer\u003c/a>\n        \u003ca href=\"height-gage.html\" class=\"on\" aria-current=\"page\">Height gage\u003c/a>\n      \u003c/nav>\n    \u003c/header>\n\n    \u003csection>\n      \u003ch2>Slider\u003c/h2>\n      \u003cdiv class=\"units\" role=\"group\" aria-label=\"Units\">\u003cbutton type=\"button\" data-units=\"in\" aria-pressed=\"true\">Inches\u003c/button>\u003cbutton type=\"button\" data-units=\"mm\" aria-pressed=\"false\">Millimeters\u003c/button>\u003c/div>\n      \u003cdiv class=\"grid3\">\n        \u003cbutton data-move=\"-25.4\">−1″\u003c/button>\n        \u003cbutton data-move=\"-2.54\">−.100″\u003c/button>\n        \u003cbutton data-move=\"-0.254\">−.010″\u003c/button>\n        \u003cbutton data-move=\"25.4\">+1″\u003c/button>\n        \u003cbutton data-move=\"2.54\">+.100″\u003c/button>\n        \u003cbutton data-move=\"0.254\">+.010″\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cbutton id=\"lowerBtn\" class=\"primary\">Bring down onto the part\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cinput type=\"text\" id=\"setTo\" placeholder=\"Go to 3.742\" inputmode=\"decimal\" aria-label=\"Move the scriber to a reading\">\n        \u003cbutton id=\"goBtn\" style=\"flex:0 0 56px\">Go\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton class=\"tgl\" id=\"fineBtn\" aria-pressed=\"false\" data-tip=\"Fine adjust&#10;Slows the slider, the fine-feed nut, the scale knob and the arrow keys down about 10× so you can creep onto a line.\">\u003ci class=\"fa-solid fa-feather-pointed\">\u003c/i>\u003cspan>Fine adjust\u003c/span>\u003cem>off\u003c/em>\u003c/button>\u003c/div>\n      \u003cp class=\"sub\">Clamps\u003c/p>\n      \u003cdiv class=\"grid2\">\n        \u003cbutton id=\"clampUnit\" class=\"lock\" aria-pressed=\"false\">Clamp fine-feed unit\u003c/button>\n        \u003cbutton id=\"clampSlider\" class=\"lock\" aria-pressed=\"false\">Clamp slider\u003c/button>\n      \u003c/div>\n      \u003cp class=\"sub\">Fine feed (unit clamped)\u003c/p>\n      \u003cdiv class=\"grid2\">\n        \u003cbutton data-fine=\"-1\" title=\"Turn the fine-feed nut: slider down\">Nut ↓ slider down\u003c/button>\n        \u003cbutton data-fine=\"1\" title=\"Turn the fine-feed nut: slider up\">Nut ↑ slider up\u003c/button>\n      \u003c/div>\n      \u003cp class=\"note\">Coarse: drag the slider. Fine: clamp the upper unit, then turn the knurled nut on top of it (drag it or scroll over it). Clamp the slider to hold the reading.\u003c/p>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2>Main scale zero\u003c/h2>\n      \u003cinput type=\"range\" id=\"zeroAdj\" min=\"-750\" max=\"750\" step=\"1\" value=\"0\" aria-label=\"Main scale adjustment\">\n      \u003cdiv class=\"row\">\n        \u003cbutton id=\"zeroBtn\">Set zero on the plate\u003c/button>\n        \u003cbutton id=\"reclampBtn\" title=\"Loosen and re-tighten the scriber clamp: the scriber ends up slightly high or low\">Re-clamp scriber\u003c/button>\n      \u003c/div>\n      \u003cp class=\"note\" id=\"zeroNote\">The whole main scale slides up to 7.5 mm either way on the knob at the top of the beam, so the gage can be zeroed on the plate.\u003c/p>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2>Part\u003c/h2>\n      \u003cselect id=\"partSel\" aria-label=\"Part to measure\">\u003c/select>\n      \u003cdiv id=\"feats\">\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton id=\"newVals\">New random heights\u003c/button>\u003cbutton id=\"revealBtn\">Show actual\u003c/button>\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"answer\">\n      \u003ch2>Highlights\u003c/h2>\n      \u003cdiv class=\"hlcards\">\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-main)\">\u003cinput type=\"checkbox\" data-hl=\"imain\" checked>\u003cspan>\u003cb>Inch main scale\u003c/b>\u003csmall>Last 0.050″ line below the vernier 0\u003c/small>\u003c/span>\u003c/label>\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-vern)\">\u003cinput type=\"checkbox\" data-hl=\"ivern\" checked>\u003cspan>\u003cb>Inch vernier\u003c/b>\u003csmall>The line that lines up — 0.001″ each\u003c/small>\u003c/span>\u003c/label>\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-mmain)\">\u003cinput type=\"checkbox\" data-hl=\"mmain\" checked>\u003cspan>\u003cb>Metric main scale\u003c/b>\u003csmall>Last 1 mm line below the vernier 0\u003c/small>\u003c/span>\u003c/label>\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-mvern)\">\u003cinput type=\"checkbox\" data-hl=\"mvern\" checked>\u003cspan>\u003cb>Metric vernier\u003c/b>\u003csmall>The line that lines up — 0.02 mm each\u003c/small>\u003c/span>\u003c/label>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"help\">\n      \u003ch2>Reading a vernier height gage\u003c/h2>\n      \u003cp>\u003cb>Inch (left):\u003c/b> the main scale is in 0.050″ steps. Take the last line below the vernier 0, then add the vernier line that lines up exactly with a main-scale line — each one is 0.001″.\u003c/p>\n      \u003cp>\u003cb>Metric (right):\u003c/b> whole millimeters from the main scale, plus the lined-up vernier line × 0.02 mm. The vernier's big numbers are tenths of a millimeter.\u003c/p>\n      \u003cp>\u003cb>Mouse:\u003c/b> drag the part to slide it around the plate (the scriber lifts to 0.100″ above its tallest point; the face it will land on turns green, and holding still for a moment or letting go measures it), drag the slider or scriber to move it, drag or scroll the fine-feed nut, click a clamp knob to lock it, turn the knob at the top of the beam to shift the main scale.\u003c/p>\n      \u003cp>\u003cb>Keys:\u003c/b> ↑↓ 0.001″ (0.02 mm in millimeters; the fine nut when the unit is clamped), Shift for 0.050″ (1 mm), F fine adjust, U / S clamps, V vernier view.\u003c/p>\n    \u003c/section>\n  \u003c/aside>\n\n  \u003cmain>\n    \u003cdiv id=\"view\">\n      \u003cdiv class=\"loading\" id=\"loading\">\u003cdiv class=\"ld\">\u003cspan class=\"ld-t\" id=\"ldT\">Loading the 3D engine…\u003c/span>\u003cdiv class=\"ld-bar\" role=\"progressbar\" aria-label=\"Loading\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\">\u003ci id=\"ldFill\">\u003c/i>\u003c/div>\u003cspan class=\"ld-p\" id=\"ldP\">0%\u003c/span>\u003c/div>\u003c/div>\n      \u003cscript>\n      // runs as the page is read, before the 3D engine downloads: the bar creeps toward a cap as files arrive,\n      // and __load.set() moves it (and the cap) on at each real step; __load.done() fills it and fades it out\n      (function(){\n        var fill = document.getElementById('ldFill'), bar = fill.parentNode, pct = document.getElementById('ldP'), txt = document.getElementById('ldT');\n        var p = 0.03, cap = 0.5, done = false;\n        function draw(){ fill.style.transform = 'scaleX(' + p + ')'; var n = Math.round(p*100); pct.textContent = n + '%'; bar.setAttribute('aria-valuenow', n); }\n        function set(v, label){ if (done) return; p = Math.max(p, v); cap = Math.max(cap, Math.min(0.97, v + 0.3)); if (label) txt.textContent = label; draw(); }\n        var timer = setInterval(function(){ if (!done){ p += (cap - p)*0.05; draw(); } }, 120);\n        try { new PerformanceObserver(function(list){ list.getEntries().forEach(function(){ p += (cap - p)*0.25; }); if (!done) draw(); }).observe({ type: 'resource', buffered: true }); } catch (e) {}\n        window.__load = { set: set, done: function(){\n          if (done) return; set(1, 'Ready'); done = true; clearInterval(timer);\n          var el = document.getElementById('loading'); el.classList.add('ld-out'); setTimeout(function(){ el.remove(); }, 350);\n        } };\n        draw();\n      })();\n      \u003c/script>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"ib\" id=\"sideBtn\" aria-pressed=\"false\" aria-label=\"Hide the side panel\" data-tip=\"Hide the side panel&#10;Gives the 3D view the whole width.\">\u003ci class=\"fa-solid fa-angles-left ic-off\">\u003c/i>\u003ci class=\"fa-solid fa-angles-right ic-on\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"examBtn\" data-tip=\"Examination&#10;Cinematic tour with labels on every part. Rotate, pan and zoom freely.\">\u003ci class=\"fa-solid fa-binoculars\">\u003c/i>\u003cspan>Examine\u003c/span>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"practiceBtn\" aria-pressed=\"false\" data-tip=\"Practice reading&#10;Hides the readings and picks a random part and height.\">\u003ci class=\"fa-solid fa-graduation-cap\">\u003c/i>\u003cspan>Practice\u003c/span>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"faceBtn\" aria-pressed=\"false\" data-tip=\"Click face to measure&#10;Click any flat face on the part and the tool moves there and measures it. Dragging the part still slides it.\">\u003ci class=\"fa-solid fa-hand-pointer\">\u003c/i>\u003cspan>Click face\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"quick\" role=\"group\" aria-label=\"Panel controls\">\n        \u003cbutton class=\"ib\" id=\"panelBtn\" aria-pressed=\"false\" aria-label=\"Hide the reading panel\" data-tip=\"Hide the reading panel&#10;Gives the 3D view the whole height.\">\u003ci class=\"fa-solid fa-angles-down ic-off\">\u003c/i>\u003ci class=\"fa-solid fa-angles-up ic-on\">\u003c/i>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"xlayer\" id=\"xlayer\" aria-hidden=\"true\">\u003csvg id=\"xsvg\">\u003c/svg>\u003c/div>\n      \u003cdiv class=\"cine top\">\u003cspan class=\"ct\">Examination\u003c/span>\u003cdiv class=\"cc\">\n        \u003cbutton class=\"pbtn\" id=\"spinBtn\" aria-pressed=\"true\">\u003ci class=\"fa-solid fa-rotate\">\u003c/i>\u003cspan class=\"lbl\">Auto-rotate\u003c/span>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"labelsBtn\" aria-pressed=\"true\">\u003ci class=\"fa-solid fa-tags\">\u003c/i>\u003cspan class=\"lbl\">Labels\u003c/span>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"exitExam\" aria-label=\"Exit examination\">\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\u003cspan class=\"lbl\">Exit\u003c/span>\u003c/button>\u003c/div>\u003c/div>\n      \u003cdiv class=\"cine bot\">\u003cspan class=\"chint\">Left-drag to rotate · right-drag to pan · scroll to zoom · Esc to exit\u003c/span>\u003c/div>\n      \u003cdiv class=\"views\" role=\"group\" aria-label=\"Camera views\">\n        \u003cbutton class=\"ib\" data-view=\"iso\" aria-label=\"Iso view\" data-tip=\"Iso view\">\u003ci class=\"fa-solid fa-cube\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" data-view=\"front\" aria-label=\"Front view\" data-tip=\"Front view\">\u003ci class=\"fa-solid fa-vector-square\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" data-view=\"vernier\" aria-label=\"Vernier view\" data-tip=\"Vernier close-up&#10;Both scales and both verniers.\">\u003ci class=\"fa-solid fa-ruler-vertical\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" data-view=\"scriber\" aria-label=\"Scriber view\" data-tip=\"Scriber close-up&#10;The carbide tip on the part.\">\u003ci class=\"fa-solid fa-magnifying-glass-plus\">\u003c/i>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"flat\" id=\"flat\">\n        \u003cdiv class=\"flat-h\">\u003cspan>Scales, flat view\u003c/span>\u003cbutton class=\"ib sm\" id=\"flatBtn\" aria-label=\"Hide flat view\" aria-expanded=\"true\" data-tip=\"Hide flat view\">\u003ci class=\"fa-solid fa-eye-slash\">\u003c/i>\u003c/button>\u003c/div>\n        \u003ccanvas id=\"flatCv\" width=\"260\" height=\"280\" role=\"img\" aria-label=\"Main scales and verniers, drawn flat\">\u003c/canvas>\n      \u003c/div>\n      \u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n      \u003cdiv class=\"legend\" aria-label=\"Mouse controls\">\n        \u003cspan class=\"mk\">\u003cspan class=\"mouse l\" aria-hidden=\"true\">\u003ci class=\"fa-solid fa-computer-mouse\">\u003c/i>\u003cb>\u003c/b>\u003c/span>Rotate\u003c/span>\n        \u003cspan class=\"mk\">\u003cspan class=\"mouse r\" aria-hidden=\"true\">\u003ci class=\"fa-solid fa-computer-mouse\">\u003c/i>\u003cb>\u003c/b>\u003c/span>Pan\u003c/span>\n        \u003cspan class=\"mk\">\u003cspan class=\"mouse m\" aria-hidden=\"true\">\u003ci class=\"fa-solid fa-computer-mouse\">\u003c/i>\u003cb>\u003c/b>\u003c/span>Zoom\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"hint\" id=\"hint\" hidden>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"flat-dock\" id=\"flatDock\">\u003c/div>\n    \u003csection class=\"reading\" id=\"reading\" aria-live=\"polite\">\n      \u003cdiv class=\"rgroup answer\">\n        \u003cspan class=\"rtitle\">Inch\u003c/span>\n        \u003cdiv class=\"cell\" style=\"--c:var(--hl-main)\">\u003cspan class=\"k\">Main scale\u003c/span>\u003cspan class=\"v\" id=\"iMain\">\u003c/span>\u003cspan class=\"h\" id=\"iMainH\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op\">+\u003c/span>\n        \u003cdiv class=\"cell\" style=\"--c:var(--hl-vern)\">\u003cspan class=\"k\">Vernier\u003c/span>\u003cspan class=\"v\" id=\"iVern\">\u003c/span>\u003cspan class=\"h\" id=\"iVernH\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op\">=\u003c/span>\n        \u003cdiv class=\"cell total\">\u003cspan class=\"k\">Reading\u003c/span>\u003cspan class=\"v\" id=\"iTot\">\u003c/span>\u003cspan class=\"h\">inches\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"rgroup answer\">\n        \u003cspan class=\"rtitle\">Metric\u003c/span>\n        \u003cdiv class=\"cell\" style=\"--c:var(--hl-mmain)\">\u003cspan class=\"k\">Main scale\u003c/span>\u003cspan class=\"v\" id=\"mMain\">\u003c/span>\u003cspan class=\"h\" id=\"mMainH\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op\">+\u003c/span>\n        \u003cdiv class=\"cell\" style=\"--c:var(--hl-mvern)\">\u003cspan class=\"k\">Vernier\u003c/span>\u003cspan class=\"v\" id=\"mVern\">\u003c/span>\u003cspan class=\"h\" id=\"mVernH\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op\">=\u003c/span>\n        \u003cdiv class=\"cell total\">\u003cspan class=\"k\">Reading\u003c/span>\u003cspan class=\"v\" id=\"mTot\">\u003c/span>\u003cspan class=\"h\">millimeters\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"rstat\">\n        \u003cspan class=\"status-chip\" id=\"status\">Slider free\u003c/span>\n        \u003cspan class=\"status-chip\" id=\"contact\">Scriber in the air\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"pract\">\n        \u003cselect id=\"pUnit\" aria-label=\"Answer units\">\u003coption value=\"in\">Inch\u003c/option>\u003coption value=\"mm\">Metric\u003c/option>\u003c/select>\n        \u003cinput type=\"text\" id=\"guess\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"0.000\" aria-label=\"Your reading\">\n        \u003cbutton class=\"primary\" id=\"checkBtn\">Check\u003c/button>\n        \u003cbutton id=\"nextBtn\">Next\u003c/button>\n        \u003cdiv id=\"pfb\" aria-live=\"polite\">\u003cp class=\"pintro\">Read the gage and type the height.\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n  \u003c/main>\n\u003c/div>\n\n\u003cdiv class=\"tut\" id=\"tut\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tutTitle\" hidden>\n  \u003cdiv class=\"tut-card\">\n    \u003ch3 id=\"tutTitle\">Welcome to the height gage!\u003c/h3>\n    \u003cp>This is a working height gage on a flat granite table. It measures how tall things are, up to 12 inches or 300 millimeters.\u003c/p>\n    \u003cp class=\"tut-mouse\">\u003cb>Using the mouse:\u003c/b> To \u003cb>click\u003c/b>, press the left mouse button once. To \u003cb>drag\u003c/b>, hold the left mouse button down, move the mouse, and then let go.\u003c/p>\n    \u003col>\n      \u003cli>\u003cb>Picking something to measure.\u003c/b> Choose a part from the “Part” list on the left, then click one of its steps. The gage slides the part under the pointed tip and measures it for you.\u003c/li>\n      \u003cli>\u003cb>Moving the part yourself.\u003c/b> Drag the part around the table. The tip lifts a little above the part while it moves, so nothing bumps.\u003c/li>\n      \u003cli>\u003cb>Seeing what it will measure.\u003c/b> The top of the part under the tip turns green. Hold the part still for a moment, or let go of it, and the tip comes down and measures it.\u003c/li>\n      \u003cli>\u003cb>Moving the tip yourself.\u003c/b> Drag the sliding block up or down, or use the + and − buttons on the left to move it by exact amounts.\u003c/li>\n      \u003cli>\u003cb>Moving very slowly.\u003c/b> Lock the upper block, then drag or scroll on the ridged nut on top of it. This moves the tip a tiny bit at a time.\u003c/li>\n      \u003cli>\u003cb>Locking it.\u003c/b> Click one of the ridged side knobs. It turns red while it is locked, and it stays red until you click it again.\u003c/li>\n      \u003cli>\u003cb>Setting zero.\u003c/b> Click “Set zero on the plate” to set the reading to 0 on the table. You can also turn the knob at the top of the tall bar.\u003c/li>\n      \u003cli>\u003cb>Reading it.\u003c/b> Find the last line on the tall scale below the “0” of the sliding scale. Then add the line on the sliding scale that lines up perfectly with a line on the tall scale.\u003c/li>\n      \u003cli>\u003cb>Inches or millimeters.\u003c/b> The inch scales are on the left side, and the millimeter scales are on the right side.\u003c/li>\n      \u003cli>\u003cb>Using the flat view.\u003c/b> The small card in the corner shows both scales flat and straight on, so they are easier to read.\u003c/li>\n      \u003cli>\u003cb>Practicing.\u003c/b> Click “Practice,” type what you read, and click “Check.” It shows you step by step where each number comes from.\u003c/li>\n      \u003cli>\u003cb>Learning the parts.\u003c/b> Click “Examine” to see the gage turn slowly with the name of every part on it.\u003c/li>\n      \u003cli>\u003cb>Looking around.\u003c/b> Drag an empty part of the picture to turn the view. Hold the right mouse button and move the mouse to slide the view. Roll the mouse wheel to zoom in and out.\u003c/li>\n    \u003c/ol>\n    \u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"tutClose\">Start measuring\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js\">\u003c/script>\n\u003cscript type=\"importmap\">\n{ \"imports\": {\n  \"three\": \"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js\",\n  \"three/addons/\": \"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/\"\n} }\n\u003c/script>\n\u003cscript type=\"module\">\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\nimport { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\nwindow.__load && window.__load.set(0.55, 'Building the height gage…');\n\nconst T = THREE, TAU = Math.PI*2, IN = 25.4;\nconst $ = id => document.getElementById(id);\nconst cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n\n/* ---------------------------------------------------------------------------\n   Mitutoyo 514-103 (catalog US-1003, Series 514): 0–12″ / 0–300 mm dual scale,\n   .001″ / 0.02 mm verniers, overall height 525, base 135 long x 45 high,\n   slider 70, fine-feed unit 20, beam 28 wide, scriber 07GZA000 80 x 32 x 9 x 9,\n   main scale adjustable 15 mm. All units below are millimeters, y up, the\n   surface plate top at y = 0.\n--------------------------------------------------------------------------- */\nconst H_TOTAL = 525, BASE_L = 135, BASE_H = 45, BASE_D = 80, BASE_X0 = -4, BASE_X1 = BASE_X0 + BASE_L;\nconst BEAM_X0 = 0, BEAM_X1 = 28, BEAM_Z0 = -5, BEAM_Z1 = 5;\nconst SL_H = 70, SL_X0 = -15, SL_X1 = 47, SL_Z0 = -9, PLATE_Z = 6.5;\nconst UNIT_H = 20;\nconst SCRIBE_DROP = 47;                  // scriber face to slider bottom\nconst V0 = 5;                            // vernier 0 line above the slider bottom\nconst SCALE_Y0 = SCRIBE_DROP + V0;       // main-scale 0 on the beam, before adjustment\nconst RANGE = 300;\nconst IN_MAIN = 0.05*IN, IN_VDIV = 0.049*IN;   // 50 vernier divisions over 49 main\nconst MM_VDIV = 0.98;                          // 50 vernier divisions over 49 mm\nconst FINE_MIN = 0, FINE_MAX = 9, FINE_PITCH = 0.5;   // fine-feed gap and mm per nut turn\nconst ZERO_RANGE = 7.5;\nconst TIP_X0 = -100, TIP_X1 = -93, TIP_Z0 = 1, TIP_Z1 = 10;   // scriber measuring face\nconst GRANITE = { x0: -460, x1: 320, z0: -240, z1: 240 };     // surface plate top\nconst CLEAR = 0.1*IN;                    // while the part moves, the scriber waits 0.100″ above its tallest point\n// everything hanging below the slider, as footprints over the plate:\n// [x0, x1, z0, z1, underside height above the scriber face, moves with the scriber in its clamp]\nconst UNDER = [\n  [TIP_X0, -50, TIP_Z0, TIP_Z1, 0, true],             // scriber: flat underside, the measuring face\n  [-58, -20, TIP_Z0, TIP_Z1, 23, true],               // scriber: raised arm into the clamp\n  [-36, -19, -1, 12, 17, false],                      // scriber clamp\n  [-21, -14, -3, 5, 21, false],                       // arm from the slider to the clamp\n  [SL_X0, SL_X1 + 14, SL_Z0, PLATE_Z, SCRIBE_DROP, false]   // slider and its clamp knob\n];\n\n/* ---------- renderer ---------- */\nconst wrap = $('view');\nconst renderer = new T.WebGLRenderer({ antialias: true, alpha: true });\nrenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\nrenderer.setClearColor(0x000000, 0);\nrenderer.toneMapping = T.ACESFilmicToneMapping;\nrenderer.toneMappingExposure = 1.05;\nrenderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = T.PCFSoftShadowMap;\nwrap.appendChild(renderer.domElement);\nconst MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());\n\n\n/* ---------- shop finish: real tools are satin and handled, not mirror-bright ----------\n   Every lit material in the scene gets this once: chrome and lapped faces become satin, bare metal\n   picks up fine scratches and handling marks, reflections are toned down, paint is a dull satin.\n   Materials that glow on purpose (locked parts, highlights) are left alone. */\nconst WEAR_TEX = (() => {\n  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;\n  const g = c.getContext('2d');\n  g.fillStyle = 'rgb(222,222,222)'; g.fillRect(0, 0, s, s);\n  // fine scratches from handling and cleaning\n  for (let i = 0; i \u003c 900; i++){\n    const x = Math.random()*s, y = Math.random()*s, a = (Math.random() \u003c 0.6 ? 0.1 : Math.PI/2) + (Math.random() - 0.5)*0.5, L = 6 + Math.random()*40;\n    const v = Math.random() \u003c 0.5 ? 255 : 170;\n    g.strokeStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.15 + Math.random()*0.3) + ')'; g.lineWidth = 0.6 + Math.random()*0.8;\n    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*L, y + Math.sin(a)*L); g.stroke();\n  }\n  // smudges and worn patches\n  for (let i = 0; i \u003c 70; i++){\n    const x = Math.random()*s, y = Math.random()*s, r = 10 + Math.random()*55, v = Math.random() \u003c 0.5 ? 255 : 175;\n    const gr = g.createRadialGradient(x, y, 0, x, y, r);\n    gr.addColorStop(0, 'rgba(' + v + ',' + v + ',' + v + ',0.35)'); gr.addColorStop(1, 'rgba(' + v + ',' + v + ',' + v + ',0)');\n    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();\n  }\n  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = 4;\n  return t;\n})();\nconst _finished = new WeakSet();\nfunction shopFinish(root){\n  root.traverse(o => {\n    if (!o.isMesh) return;\n    for (const m of Array.isArray(o.material) ? o.material : [o.material]){\n      if (!m || _finished.has(m) || !m.isMeshStandardMaterial || m.transparent) continue;\n      _finished.add(m);\n      if (m.emissive && m.emissive.getHex() !== 0 && m.emissiveIntensity > 0) continue;   // meant to glow\n      if (m.metalness >= 0.6){\n        m.roughness = Math.min(0.85, Math.max(m.roughness, 0.32) + 0.06);\n        m.color.multiplyScalar(0.8);\n        if (!m.roughnessMap){ m.roughnessMap = WEAR_TEX; m.roughness = Math.min(1, m.roughness/0.88); }\n      } else m.roughness = Math.max(m.roughness, 0.58);\n      m.envMapIntensity = (m.envMapIntensity == null ? 1 : m.envMapIntensity)*0.75;\n      m.needsUpdate = true;\n    }\n  });\n}\n\nconst scene = new T.Scene();\nscene.environmentIntensity = 0.7;\n{\n  const pm = new T.PMREMGenerator(renderer);\n  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;\n  pm.dispose();\n}\n// orthographic, like the micrometers: no perspective, so scales and faces read true at any angle.\n// VIEW_H is the height of scene shown at zoom 1; the camera sits far back along its view direction.\nconst VIEW_H = 700, CAM_BACK = 4000;\nconst camera = new T.OrthographicCamera(-1, 1, 1, -1, 1, 20000);\nconst controls = new OrbitControls(camera, renderer.domElement);\ncontrols.enableDamping = true; controls.dampingFactor = 0.1;\ncontrols.screenSpacePanning = true;\ncontrols.minZoom = 0.25; controls.maxZoom = 40;\n\nconst key = new T.DirectionalLight(0xffffff, 1.35);\nkey.position.set(260, 900, 520);\nkey.castShadow = true;\nkey.shadow.mapSize.set(2048, 2048);\nObject.assign(key.shadow.camera, { left: -420, right: 420, top: 620, bottom: -220, near: 100, far: 2400 });\nkey.shadow.bias = -0.0004; key.shadow.normalBias = 0.6;\nscene.add(key);\nconst rim = new T.DirectionalLight(0xbcd4ff, 0.35); rim.position.set(-500, 300, -600); scene.add(rim);\nscene.add(new T.HemisphereLight(0xffffff, 0x30343a, 0.35));\n\n/* ---------- textures ---------- */\nfunction canvasTex(w, h, draw, repeat, srgb){\n  const c = document.createElement('canvas'); c.width = w; c.height = h;\n  draw(c.getContext('2d'), w, h);\n  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping;\n  if (repeat) t.repeat.set(repeat[0], repeat[1]);\n  if (srgb) t.colorSpace = T.SRGBColorSpace;\n  t.anisotropy = MAX_ANISO;\n  return t;\n}\nconst rand = (a, b) => a + Math.random()*(b - a);\nconst rows = (g, w, h, base, amp) => { for (let y = 0; y \u003c h; y++){ const v = base + amp*(Math.random() - 0.5); g.fillStyle = `rgb(${v|0},${v|0},${v|0})`; g.fillRect(0, y, w, 1); } };\n// hammertone paint on the cast base\nfunction hammer(light){\n  return (g, s) => {\n    g.fillStyle = light ? '#e8e8e8' : '#808080'; g.fillRect(0, 0, s, s);\n    for (let i = 0; i \u003c 2400; i++){\n      const x = Math.random()*s, y = Math.random()*s, r = 2 + Math.random()*10;\n      const up = Math.random() \u003c 0.5, v = light ? (up ? 255 : 196) : (up ? 205 : 55);\n      const gr = g.createRadialGradient(x, y, 0, x, y, r);\n      gr.addColorStop(0, `rgba(${v},${v},${v},${light ? 0.35 : 0.5})`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`);\n      g.fillStyle = gr;\n      for (const dx of [-s, 0, s]) for (const dy of [-s, 0, s]){ g.beginPath(); g.arc(x + dx, y + dy, r, 0, TAU); g.fill(); }\n    }\n  };\n}\nconst hammerBump = canvasTex(512, 512, hammer(false), [0.02, 0.02]);\nconst hammerMap = canvasTex(512, 512, hammer(true), [0.02, 0.02], true);\nconst brushedV = canvasTex(64, 512, (g, w, h) => rows(g, w, h, 170, 110), [1, 1]);   // lengthwise grinding on the beam\nbrushedV.rotation = Math.PI/2;\nconst satinTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, w, h); g.globalAlpha = 0.12; for (let i = 0; i \u003c 2500; i++){ const v = Math.random() \u003c 0.5 ? 255 : 90; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.random()*w, Math.random()*h, 1.2, 1.2); } }, [0.08, 0.08]);\nconst granite = canvasTex(512, 512, (g, s) => {\n  g.fillStyle = '#23252a'; g.fillRect(0, 0, s, s);\n  for (let i = 0; i \u003c 9000; i++){ const v = Math.random() \u003c 0.5 ? rand(30, 70) : rand(110, 190); g.fillStyle = `rgba(${v|0},${v|0},${v|0},${rand(0.15, 0.5)})`; g.beginPath(); g.arc(Math.random()*s, Math.random()*s, rand(0.6, 2.6), 0, TAU); g.fill(); }\n}, [0.004, 0.004], true);\n// diamond knurl as a normal map with shaded valleys\nfunction knurlMaps(){\n  const size = 64, nC = document.createElement('canvas'), cC = document.createElement('canvas');\n  nC.width = nC.height = cC.width = cC.height = size;\n  const nG = nC.getContext('2d'), cG = cC.getContext('2d'), nD = nG.createImageData(size, size), cD = cG.createImageData(size, size);\n  const frac = t => t - Math.floor(t);\n  for (let j = 0; j \u003c size; j++) for (let i = 0; i \u003c size; i++){\n    const x = (i + 0.5)/size, y = (j + 0.5)/size, fa = frac(x + y), fb = frac(x - y);\n    const a = 1 - 2*Math.abs(fa - 0.5), b = 1 - 2*Math.abs(fb - 0.5);\n    let h, gx, gy;\n    if (a \u003c b){ h = a; const s = fa \u003c 0.5 ? 2 : -2; gx = s; gy = s; } else { h = b; const s = fb \u003c 0.5 ? 2 : -2; gx = s; gy = -s; }\n    if (h > 0.78){ gx = 0; gy = 0; }\n    let nx = -gx*1.1, ny = gy*1.1, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;\n    const k = (j*size + i)*4;\n    nD.data[k] = (nx*0.5 + 0.5)*255; nD.data[k+1] = (ny*0.5 + 0.5)*255; nD.data[k+2] = (nz*0.5 + 0.5)*255; nD.data[k+3] = 255;\n    const sh = 120 + 118*Math.pow(Math.min(h/0.78, 1), 0.55); cD.data[k] = sh; cD.data[k+1] = sh + 1; cD.data[k+2] = sh + 4; cD.data[k+3] = 255;\n  }\n  nG.putImageData(nD, 0, 0); cG.putImageData(cD, 0, 0);\n  return { nC, cC };\n}\nconst KN = knurlMaps();\nfunction knurlMat(ru, rv, color){\n  const map = new T.CanvasTexture(KN.cC), nrm = new T.CanvasTexture(KN.nC);\n  for (const t of [map, nrm]){ t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(ru, rv); t.anisotropy = MAX_ANISO; }\n  map.colorSpace = T.SRGBColorSpace;\n  return new T.MeshStandardMaterial({ map, normalMap: nrm, color: color || 0xffffff, metalness: 1, roughness: 0.42 });\n}\n\n/* ---------- finishes: ground, lapped and turned surfaces, as they come off the machines ---------- */\n// surface grinding: fine straight lines, a little uneven\nconst groundTex = canvasTex(256, 256, (g, w, h) => { rows(g, w, h, 180, 70); g.globalAlpha = 0.12; for (let i = 0; i \u003c 120; i++){ const y = Math.random()*h; g.fillStyle = Math.random() \u003c 0.5 ? '#fff' : '#555'; g.fillRect(0, y, w, 1); } }, [0.06, 0.06]);\n// lapping: a fine random cross-hatch\nconst lappedTex = canvasTex(256, 256, (g, w, h) => {\n  g.fillStyle = '#c8c8c8'; g.fillRect(0, 0, w, h);\n  for (let i = 0; i \u003c 1800; i++){ const x = Math.random()*w, y = Math.random()*h, a = Math.random()*Math.PI, L = 4 + Math.random()*14, v = Math.random() \u003c 0.5 ? 235 : 150;\n    g.strokeStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.35)'; g.lineWidth = 0.7; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*L, y + Math.sin(a)*L); g.stroke(); }\n}, [0.05, 0.05]);\n// turning: rings around the part\nconst turnedTex = canvasTex(64, 256, (g, w, h) => rows(g, w, h, 170, 100), [1, 8]);\nturnedTex.rotation = Math.PI/2;\n/* ---------- materials ---------- */\nconst std = o => new T.MeshStandardMaterial(o);\nconst M = {\n  beam: std({ color: 0xdfe2e6, metalness: 1, roughness: 0.3, roughnessMap: brushedV }),\n  steel: std({ color: 0xd6d9dd, metalness: 1, roughness: 0.34, roughnessMap: groundTex, bumpMap: groundTex, bumpScale: 0.12 }),\n  plate: std({ color: 0xe6e8eb, metalness: 0.8 v).toFixed(UNIT[u].dp);\nfunction explainHG(u, you, ans, Rmm){\n  const U = UNIT[u], A = splitU(u, ans), Y = splitU(u, Math.max(0, you)), notes = [], why = {};\n  const other = u === 'in' ? Rmm : Rmm/IN, otherU = u === 'in' ? 'mm' : 'in';\n  if (Math.abs(you - other) \u003c= UNIT[otherU].step*1.5 && Math.abs(you - ans) > U.step){\n    notes.push({ icon: 'fa-right-left', title: 'That’s the ' + (u === 'in' ? 'metric' : 'inch') + ' reading — and it’s right!', text: 'You read the ' + UNIT[otherU].side + '-hand scales perfectly. The answer box is set to ' + (u === 'in' ? 'inches' : 'millimeters') + ', so read the ' + U.side + '-hand scales this time (or switch the box to ' + (u === 'in' ? 'Metric' : 'Inch') + ').' });\n    return { A, Y, notes, why, swap: true };\n  }\n  const ratio = ans ? you/ans : 0, lg = ratio > 0 ? Math.log10(ratio) : NaN;\n  if (Number.isFinite(lg) && Math.round(lg) !== 0 && Math.abs(lg - Math.round(lg)) \u003c 1e-9){\n    notes.push({ icon: 'fa-heart', title: 'Every line was read correctly — only the decimal point wandered', text: 'This one is written ' + fmtU(u, ans) + U.sym + '. That’s a tiny fix!' });\n    return { A, Y, notes, why, decimal: true };\n  }\n  if (Y.mainIdx !== A.mainIdx){\n    why.main = Y.mainIdx === A.mainIdx + 1\n      ? 'So close! That line is just \u003ci>above\u003c/i> the vernier’s 0, so the slider hasn’t reached it yet. The last ' + U.lineWord + ' at or below the 0 is worth \u003cb>' + fmtU(u, A.main) + U.sym + '\u003c/b>.'\n      : Y.mainIdx === A.mainIdx - 1\n      ? 'Nearly! One more ' + U.lineWord + ' has already slipped below the vernier’s 0, so it counts. The main scale gives \u003cb>' + fmtU(u, A.main) + U.sym + '\u003c/b>.'\n      : 'Look straight across from the vernier’s 0 line to the ' + U.side + '-hand main scale: the last line below it is worth \u003cb>' + fmtU(u, A.main) + U.sym + '\u003c/b>' + (u === 'in' ? ' (each line is 0.050″, numbered every inch).' : ' (each line is 1 mm, numbered every centimeter).'); ass=\"fa-solid fa-location-arrow\">\u003c/i>Highlighted on the gage\u003c/span>\u003cbutton class=\"fx-show\" data-show=\"' + u + ':' + k + '\">\u003ci class=\"fa-solid fa-crosshairs\">\u003c/i>Show me\u003c/button>\u003c/div>\u003c/article>';\n  }).join('') + '\u003c/div>' : '';\n  const good = !ok && Y ? KEYS.filter(k => !wrong.includes(k)) : [];\n  const goodRow = good.length ? '\u003cdiv class=\"fx-sec\">What you got right\u003c/div>\u003cdiv class=\"fx-good\">' + good.map(k => '\u003cspan>\u003ci class=\"fa-solid fa-circle-check\">\u003c/i>' + STEPS[k].name + '\u003c/span>').join('') + '\u003c/div>' : '';\n  const foot = '\u003cdiv class=\"fx-foot\">\u003ci class=\"fa-solid ' + (ok ? 'fa-star' : 'fa-heart') + '\">\u003c/i>\u003cspan>' + (ok ? 'Press \u003cb>Next\u003c/b> whenever you’d like another one.'\n    : 'Every expert has made this exact slip while learning. The colored lines on the gage show the right marks — press \u003cb>Next\u003c/b> when you feel ready.') + '\u003c/span>\u003c/div>';\n  fb.className = '';\n  fb.innerHTML = '\u003cdiv class=\"fx\">' + hero + cmp + missBox + notes + eq + steps + goodRow + foot + '\u003c/div>';\n  fb.scrollTop = 0;\n}\n\n/* ---------- examination: labels on every part ---------- */\nconst SVGNS = 'http://www.w3.org/2000/svg';\nconst _p = new T.Vector3(), _q = new T.Vector3(), _cd = new T.Vector3();\nfunction makeTag(){\n  const dot = document.createElement('span'); dot.className = 'xdot';\n  const box = document.createElement('div'); box.className = 'xl'; box.innerHTML = '\u003cb>\u003c/b>\u003csmall>\u003c/small>';\n  const ln = document.createElementNS(SVGNS, 'line');\n  $('xsvg').appendChild(ln); $('xlayer').appendChild(dot); $('xlayer').appendChild(box);\n  return { dot, box, ln, b: box.querySelector('b'), sm: box.querySelector('small') };\n}\nfunction dropTag(t){ t.dot.remove(); t.box.remove(); t.ln.remove(); }\nconst clampTag = (v, a, b) => Math.max(a, Math.min(b, v));\nfunction placeTag(t, p, nrm, off, placed){\n  const r = wrap.getBoundingClientRect();\n  _p.copy(p).project(camera);\n  const sx = (_p.x + 1)/2*r.width, sy = (1 - _p.y)/2*r.height;\n  _q.copy(p).add(nrm).project(camera);\n  let dx = (_q.x + 1)/2*r.width - sx, dy = (1 - _q.y)/2*r.height - sy;\n  const L = Math.hypot(dx, dy);\n  if (L \u003c 1e-3){ dx = 0.6; dy = -0.8; } else { dx /= L; dy /= L; }\n  camera.getWorldDirection(_cd);\n  const facing = -(nrm.x*_cd.x + nrm.y*_cd.y + nrm.z*_cd.z);\n  const tx = sx + dx*off, ty = sy + dy*off;\n  const ax = dx \u003c -0.35 ? -1 : dx > 0.35 ? 0 : -0.5;\n  const ay = dy \u003c -0.35 ? -1 : dy > 0.35 ? 0 : -0.5;\n  // labels are nowrap, so their size only changes with their text — measure then, not every frame\n  const txt = t.b.textContent + '\u0000' + t.sm.textContent;\n  if (!t.bw || t.txt !== txt || t.vw !== innerWidth) { t.bw = t.box.offsetWidth; t.bh = t.box.offsetHeight; t.txt = txt; t.vw = innerWidth; }   // again if it was first sized while hidden, or the window changed\n  // keep the whole label inside the view instead of letting it run off the edge\n  const m = 6, bw = t.bw, bh = t.bh, loY = m, hiY = Math.max(m, r.height - bh - m);\n  let bx = clampTag(tx + ax*bw, m, Math.max(m, r.width - bw - m));\n  let by = clampTag(ty + ay*bh, loY, hiY);\n  // find the nearest spot where the label covers neither another label nor a panel or button row:\n  // try steps up and down, and each side of everything already placed; failing that, the least covered spot\n  if (placed && facing > -0.08) {\n    const g = 4, hiX = Math.max(m, r.width - bw - m);\n    const cover = (x, y) => placed.reduce((sum, q) => sum +\n      Math.max(0, Math.min(x + bw + g, q.x + q.w) - Math.max(x - g, q.x))*Math.max(0, Math.min(y + bh + g, q.y + q.h) - Math.max(y - g, q.y)), 0);\n    if (cover(bx, by) > 0){\n      const xs = [bx], ys = [by];\n      for (let k = 1; k \u003c= 14; k++) ys.push(by + k*(bh + g)/2, by - k*(bh + g)/2);\n      for (const q of placed) xs.push(q.x - bw - g, q.x + q.w + g);\n      let best = null;\n      for (const x0 of xs) for (const y0 of ys){\n        const x = clampTag(x0, m, hiX), y = clampTag(y0, loY, hiY);\n        const c = cover(x, y)*1e4 + Math.hypot(x - bx, y - by);\n        if (!best || c \u003c best.c) best = { x, y, c };\n      }\n      bx = best.x; by = best.y;\n    }\n    placed.push({ x: bx, y: by, w: bw, h: bh });\n  }\n  t.dot.style.transform = `translate(${sx}px,${sy}px)`;\n  t.box.style.transform = `translate(${bx}px,${by}px)`;\n  // end the leader on the point of the label nearest its dot\n  t.ln.setAttribute('x1', sx); t.ln.setAttribute('y1', sy);\n  t.ln.setAttribute('x2', clampTag(sx, bx, bx + bw)); t.ln.setAttribute('y2', clampTag(sy, by, by + bh));\n  const op = facing > -0.08 ? '1' : '0.15';\n  t.dot.style.opacity = op; t.box.style.opacity = op; t.ln.style.opacity = op;\n}\nconst V = (x, y, z) => new T.Vector3(x, y, z);\nconst N = (x, y, z) => new T.Vector3(x, y, z).normalize();\nconst slY = () => state.hs + SCRIBE_DROP, unY = () => state.hs + SCRIBE_DROP + SL_H + state.g;\nconst EXAM = [\n  ['Beam', 'Hardened stainless steel', () => ({ p: V(BEAM_X1, 410, 0), n: N(1, 0, 0.35) })],\n  ['Main scale — inch', '0.050″ lines, numbered every inch', () => ({ p: V(3, SCALE_Y0 + state.delta + 250, BEAM_Z1), n: N(-0.6, 0.1, 1) })],\n  ['Main scale — metric', '1 mm lines, numbered every centimeter', () => ({ p: V(25, SCALE_Y0 + state.delta + 215, BEAM_Z1), n: N(0.6, 0.1, 1) })],\n  ['Main-scale adjustment', 'Slides the whole scale ±7.5 mm to set zero', () => ({ p: V(23, 484, BEAM_Z1 + 6), n: N(0.7, 0.3, 1) })],\n  ['Slider', 'Carries both verniers and the scriber', () => ({ p: V(SL_X0, slY() + 38, -2), n: N(-1, 0.1, 0.3) })],\n  ['Inch vernier', '50 lines, each adds 0.001″', () => ({ p: V(-7, slY() + 22, PLATE_Z), n: N(-0.5, 0, 1) })],\n  ['Metric vernier', '50 lines, each adds 0.02 mm', () => ({ p: V(37, slY() + 22, PLATE_Z), n: N(0.5, 0, 1) })],\n  ['Slider clamp', 'Locks the slider to hold a reading', () => ({ p: V(S entHeight;\n    const t = document.querySelector('.cine.top').offsetHeight, b = document.querySelector('.cine.bot').offsetHeight;\n    return [{ x: 0, y: 0, w: W, h: t, fixed: true }, { x: 0, y: H - b, w: W, h: b, fixed: true }];\n  }\n  return [];\n}\nfunction updateExam(){\n  if (!state.exam || !examLabels) return;\n  const tight = wrap.clientWidth \u003c 560, placed = labelObstacles();   // shorter leaders so labels stay clear of the edges\n  EXAM.forEach((e, i) => { const a = e[2](); placeTag(examTags[i], a.p, a.n, tight ? 44 : 70, placed); });\n}\n\n/* ---------- camera ---------- */\nlet flight = null;\nfunction orthoFor(pos, target){\n  const p = new T.Vector3(...pos), t = new T.Vector3(...target), d = p.distanceTo(t);\n  return { p: t.clone().add(p.sub(t).normalize().multiplyScalar(CAM_BACK)), t, z: VIEW_H/(0.536*d) };   // 0.536 = 2·tan 15°, the old 30° view\n}\nfunction flyTo(pos, target, ms){\n  const o = orthoFor(pos, target);\n  flight = { p0: camera.position.clone(), t0: controls.target.clone(), z0: camera.zoom, p1: o.p, t1: o.t, z1: o.z, start: performance.now(), ms: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : (ms || 800) };\n}\ncontrols.addEventListener('start', () => { flight = null; if (state.exam && controls.autoRotate) setSpin(false); });\n// \"Show me\": a tight close-up on the exact line a practice step is about\nfunction showMe(u, k){\n  const R = readingMM(), inch = u === 'in', sl = state.hs + SCRIBE_DROP;\n  let p;\n  if (k === 'main'){\n    const idx = inch ? splitIn(R).mainIdx : splitMM(R).mainIdx;\n    p = [inch ? 4 : BEAM_X1 - 4, SCALE_Y0 + state.delta + idx*(inch ? IN_MAIN : 1), BEAM_Z1];\n  } else {\n    const kk = inch ? splitIn(R).k : splitMM(R).k;\n    p = [inch ? 0 : 28, sl + V0 + kk*(inch ? IN_VDIV : MM_VDIV), PLATE_Z];\n  }\n  flyTo([p[0] + (inch ? -8 : 8), p[1] + 6, p[2] + 42], p);\n}\n\n/* ---------- iso view that fits: everything on the table (tool, part, blocks) sized into the open\n   screen area between the floating buttons and the flat view, whatever the window shape ---------- */\nfunction fitBox(root){\n  const box = new T.Box3(), b = new T.Box3(), s = new T.Vector3();\n  root.updateMatrixWorld(true);\n  root.traverse(o => {\n    if (!o.isMesh || o.userData.noFit) return;\n    for (let p = o; p; p = p.parent) if (!p.visible) return;\n    const m = o.material;\n    if (!m || m.isShadowMaterial || m.isShaderMaterial) return;\n    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();\n    b.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);\n    if (b.isEmpty()) return;\n    b.getSize(s); if (Math.max(s.x, s.y, s.z) > 700) return;          // the table or floor under everything\n    box.union(b);\n  });\n  return box;\n}\n// open screen areas to frame the model in: the band under the top buttons, and the column\n// between the top-left and top-right buttons (which can run the full height of the view)\nfunction freeRects(W, H){\n  const rs = [...labelObstacles(), ...[...wrap.querySelectorAll(':scope > .actions, :scope > .quick, :scope > .legend, :scope > .views, :scope > .flat')].filter(e => e.offsetParent).map(e => { const r = e.getBoundingClientRect(), w = wrap.getBoundingClientRect(); return { x: r.left - w.left, y: r.top - w.top, w: r.width, h: r.height }; })], out = [];\n  let top = 8, bottom = H - 8, left = 8, right = W - 8;\n  for (const r of rs){\n    if (r.h > H*0.4 && r.x > W*0.5) right = Math.min(right, r.x - 10);           // the flat view down the right side\n    else if (r.y + r.h/2 \u003c H/2) top = Math.max(top, r.y + r.h + 10);\n    else bottom = Math.min(bottom, r.y - 10);\n  }\n  if (bottom - top > H*0.25 && right - left > W*0.3) out.push({ x: left, y: top, w: right - left, h: bottom - top });\n  let l = 8, rr = W - 8;\n  for (const r of rs){ if (r.x + r.w/2 \u003c W/2) l = Math.max(l, r.x + r.w + 10); else rr = Math.min(rr, r.x - 10); }\n  if (rr - l > W*0.25) out.push({ x: l, y: 8, w: rr - l, h: H - 16 });\n  return out.length ? out n    // then slide it so the middle of the box sits in the middle of the free area\n    right.setFromMatrixColumn(cam.matrixWorld, 0); up.setFromMatrixColumn(cam.matrixWorld, 1);\n    const o = scr(tg), r = scr(tg.clone().add(right)), u = scr(tg.clone().add(up));\n    const kx = r[0] - o[0], ky = u[1] - o[1];\n    const dx = free.x + free.w/2 - (b.x0 + b.x1)/2, dy = free.y + free.h/2 - (b.y0 + b.y1)/2;\n    if (Math.abs(kx) > 1e-6) tg.addScaledVector(right, -dx/kx);\n    if (Math.abs(ky) > 1e-6) tg.addScaledVector(up, -dy/ky);\n  }\n  place();\n  return { target: tg, zoom: cam.zoom, pos: cam.position.clone() };\n}\nfunction setView(name){\n  const sy = state.hs + SCRIBE_DROP;\n  // front and iso are both fitted to the gage and part, so neither backs off to take in the whole table\n  if (name === 'front'){\n    const fb = fitIso(new T.Vector3(0, 18, 1120).normalize(), new T.Vector3(10, 262, 0), CAM_BACK, fitBox(root));\n    flight = { p0: camera.position.clone(), t0: controls.target.clone(), z0: camera.zoom, p1: fb.pos, t1: fb.target, z1: fb.zoom, start: performance.now(), ms: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 800 };\n  }\n  else if (name === 'vernier') flyTo([18, sy + 28, 215], [16, sy + 30, 6]);\n  else if (name === 'scriber'){ const f = faceH(); flyTo([TIP_X0 - 70, f + 60, 190], [TIP_X0 + 10, f + 4, 5]); }\n  else {\n    const dir = new T.Vector3(660, 350, 1000).normalize(), fb = fitIso(dir, new T.Vector3(-20, 210, 0), CAM_BACK, fitBox(root));\n    flight = { p0: camera.position.clone(), t0: controls.target.clone(), z0: camera.zoom, p1: fb.pos, t1: fb.target, z1: fb.zoom, start: performance.now(), ms: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 800 };\n  }\n}\n\n/* ---------- pointer ---------- */\nconst el = renderer.domElement, ray = new T.Raycaster(), ndc = new T.Vector2(), dragPlane = new T.Plane(), hitP = new T.Vector3();\nlet drag = null;\nfunction setRay(e){ const r = el.getBoundingClientRect(); ndc.set(((e.client
