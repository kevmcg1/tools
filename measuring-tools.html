*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;min-height:48px;padding:6px 14px;background:var(--bar);border-bottom:1px solid var(--line)}

.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;flex:1 1 auto;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.stage iframe.on{display:block}
@media (max-width:640px){ .brand{display:none} .bar{padding:6px 10px} .tab{padding:6px 11px} }
.foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 18px;padding:8px 14px;background:var(--bar);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot nav,#footLinks{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.foot a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
.foot a:hover,.foot a:focus-visible{color:var(--accent);border-bottom-color:currentColor;outline:none}
.foot .here{display:flex;gap:6px;align-items:center;min-width:0;max-width:100%}
.foot .here a{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;overflow-wrap:anywhere}
@media (max-width:640px){ .foot{padding:8px 10px} }
.tab{background:transparent!important}
.tab[aria-selected="true"]{color:var(--accent)!important;background:transparent!important;border-color:var(--accent)!important}
.foot{justify-content:center;text-align:center}
.foot nav,#footLinks{justify-content:center}
.foot .here{justify-content:center}
/* a separate header above the tool bar, with one outside link */
.site-head{flex:none;display:flex;justify-content:center;align-items:center;padding:6px 14px;background:var(--bar);border-bottom:1px solid var(--line);font-size:12.5px}
.site-head a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
.site-head a:hover,.site-head a:focus-visible{color:var(--accent);border-bottom-color:currentColor;outline:none}
/* dark scrollbars, matching the tools */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c2f34;background-clip:padding-box;border:3px solid transparent;border-radius:999px;min-height:40px;min-width:40px}
::-webkit-scrollbar-thumb:hover{background-color:#41454c}
::-webkit-scrollbar-thumb:active{background-color:#555a62}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:#2c2f34 transparent} }
</style>
</head>

{height:auto} }\n\n/* ================= small screens: nothing clipped, nothing unreadable ================= */\n.flat-dock{display:none}\n.t-only{display:none}\n@media (hover:none){\n  .m-only{display:none}\n  .t-only{display:inline}\n  /* a tap leaves :hover stuck on touch, so the tooltip would sit over the content */\n  [data-tip]::after{content:none}\n  .legend{display:none!important}\n}\n[data-tip]::after{max-width:min(240px,calc(100vw - 24px))}\n\n/* the reading bar is height:auto from here down, so cell text can wrap instead of being cut off */\n@media (max-width:860px){\n  .cell .v,.cell .h,.cell .k{white-space:normal;overflow:visible;text-overflow:clip}\n  .cell.feat .v{white-space:normal}\n  .status{white-space:normal;overflow:visible;text-overflow:clip;max-width:none}\n  .reading .value{width:auto}\n}\n@media (max-width:700px){\n  #view{height:min(58vh,460px);min-height:260px}\n  .legend{display:none!important}\n\n  /* the flat view moves out of the 3D pane and sits under it at full size */\n  .flat-dock{display:block;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px 12px}\n  .flat.docked{position:static;left:auto!important;top:auto!important;width:100%;max-width:none!important;\n    background:none;border:0;border-radius:0;padding:0;visibility:visible!important}\n  .flat.docked .flat-h{margin-left:0}\n  .flat.docked canvas{width:100%!important;height:auto!important;max-width:360px;aspect-ratio:260 / 280;margin:0 auto;border-radius:8px}\n\n  /* reading bar: a wrapping grid instead of a strip that scrolls off the edge */\n  .reading{padding:12px 14px;gap:10px 14px;grid-template-columns:1fr}\n  .reading .value{width:auto}\n  .value .num{font-size:36px}\n  .status{white-space:normal;overflow:visible;text-overflow:clip;max-width:none}\n  .bd{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-wrap:wrap;overflow:visible}\n  .bd .op{display:none}\n  .cell{flex:none;min-width:0}\n  .cell.feat{grid-column:1 / -1;flex:none}\n  body.vern .bd .cell.total{grid-column:1 / -1}\n  .cell .v,.cell .h,.cell .k{white-space:normal;overflow:visible;text-overflow:clip}\n  .cell.feat .v{white-space:normal}\n  .reading .meta,.reading .meta b{white-space:normal}\n\n  /* examination bar: icon-only controls so Exit never falls off the right edge */\n  .cine{padding:0 10px;gap:8px}\n  .cine .ct{font-size:20px;letter-spacing:.06em}\n  .cine .pbtn span{display:none}\n  .cine .pbtn{padding:0 11px}\n  .cine.bot .hint{font-size:11px;line-height:1.35;text-align:center}\n  body.exam .cine{height:62px}\n\n  /* feedback equation: wraps instead of scrolling a chip half off the edge */\n  .fx-eq{display:grid;grid-template-columns:1fr 1fr;gap:14px 6px;overflow:visible;padding:12px 2px 4px}\n  .fx-op{display:none}\n  .fx-chip{flex:none}\n  .fx-chip.total{grid-column:1 / -1;flex-basis:auto}\n  .fx-chip small,.fx-chip b,.fx-chip em,.fx-chip .yv{white-space:normal}\n  .fx-sum{font-size:12.5px}\n  .fx-step figure{width:calc(100% - 24px);max-width:calc(100% - 24px)}\n\n  /* examination labels: compact enough that several fit side by side on a phone */\n  .xl{padding:4px 8px;max-width:calc(100vw - 16px);white-space:normal}\n  .xl b{font-size:11.5px}\n  .xl small{font-size:10.5px}\n}\n\n@media (max-width:560px){\n  aside{padding:18px 14px 26px}\n  .app{grid-template-columns:minmax(0,1fr)}\n  .prow{flex-wrap:wrap}\n  .prow input{flex:1 1 100%;font-size:20px}\n  .pgo{flex:1 1 0;justify-content:center}\n  .actions .pbtn span,.pbtn span{font-size:13px}\n  .fx-hero{padding:11px 12px;gap:10px}\n  .fx-head h4{font-size:16px}\n  .fx-num b{font-size:22px}\n  .fx-step figure{gap:8px}\n  .tut-card{padding:16px 15px}\n  .tut-card ol{padding-left:18px}\n}\n\n@media (max-width:359px){\n  .bd{grid-template-columns:1fr}\n  .value .num{font-size:32px}\n  .grid3{gap:3px}\n  .grid3 button{padding:7px 2px;font-size:12.5px}\n}\n/* ---- dial caliper additions ---- */\n:root{ --hl-inch:#ffd43b; --hl-tenth:#ff4d4d; --hl-dial:#3d8bff; --hl-bezel:#2fd36b; --hl-sub:#f472b6; --hl-vern:#3d8bff; }\n[hidden]{display:none!important}\n.cell[data-c=\"inch\"]{--c:var(--hl-inch)}\n.cell[data-c=\"tenth\"]{--c:var(--hl-tenth)}\n.cell[data-c=\"dial\"]{--c:var(--hl-dial)}\n.cell[data-c=\"bezel\"]{--c:var(--hl-bezel)}\n.grid3 button{padding:7px 4px}\n.pcard{border:2px solid var(--c);border-radius:8px;padding:9px 10px;margin-top:8px;background:color-mix(in srgb,var(--c) 10%,var(--panel))}\n.pcard-h{display:flex;align-items:center;gap:8px}\n.pcard-h b{flex:1;font-size:13px;font-weight:600}\n.pcard-h span{font-size:11px;color:var(--c);font-weight:600;text-transform:uppercase;letter-spacing:.04em}\n.pcard p{margin:5px 0 0;font-size:12.5px;color:var(--muted)}\n.pcard .fres{margin-top:6px}\n/* ---- instrument switch: dial or vernier ---- */\nbody:not(.vern) [data-inst=\"vern\"],body.vern [data-inst=\"dial\"],body.vern .ic-dial,body:not(.vern) .ic-vern{display:none!important}\n.cell[data-c=\"sub\"]{--c:var(--hl-sub)}\n.cell[data-c=\"vern\"]{--c:var(--hl-vern)}\nsection.inst-sec{padding-top:12px}\n.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}\n.seg button{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 6px;background:transparent;color:var(--muted);font-weight:600;border-radius:6px}\n.seg button:hover{background:var(--raise);color:var(--ink)}\n.seg button[aria-checked=\"true\"]{background:var(--ink);color:var(--bg)}\nbody.vern .cell{flex-basis:88px}\nbody.vern .cell.feat{flex-basis:124px}\n.tgl{display:flex;align-items:center;gap:8px;width:100%;text-align:left}\n.tgl em{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}\n.tgl[aria-pressed=\"true\"] em{color:var(--bg);opacity:.72}\n.fine-note{margin:6px 0 0;font-variant-numeric:tabular-nums}\n.fine-note:empty{display:none}\n.bezel-val{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:-4px 0 6px}\n.bezel-val b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}\n@media (max-width:860px){ body.exam .app{grid-template-columns:1fr} body.exam #view{height:100vh;height:100dvh} }\n/* ---- layout guarantees: nothing clipped, nothing scrolled off the edge ---- */\nmain{overflow-y:auto;overflow-x:hidden}\n#view{min-height:260px}\n.reading{height:auto;min-height:var(--rh,132px)}\n@media (min-width:861px){ .practice .reading{height:var(--rh,380px);min-height:170px} }\n@media (min-width:701px){\n  .bd{flex-wrap:wrap;overflow:visible}\n  .cell{flex:1 0 auto;min-width:96px}\n  .cell .v,.cell .h,.cell .k{white-space:nowrap;overflow:visible;text-overflow:clip}\n  .cell.feat{flex:1.3 0 132px;max-width:100%}\n  .cell.feat .v,.cell.feat .h{white-space:normal}\n  .reading .meta{white-space:normal}\n  .status{white-space:normal;overflow:visible;text-overflow:clip}\n}\n/* practice feedback: stacks under the answer box when the main area is narrow, and wraps instead of scrolling sideways */\nmain{container-type:inline-size}\n@container (max-width:900px){\n  .practice .reading{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}\n  .practice .reading .value{width:auto}\n  .practice .pfb{grid-column:1;grid-row:auto}\n}\n@container (max-width:640px){ .fx-cmp{grid-template-columns:minmax(0,1fr)} .fx-delta{min-width:0} }\n.practice .pfb{overflow-x:hidden}\n.fx-hero{flex-wrap:wrap}\n.fx-head{min-width:min(220px,100%)}\n.fx-eq{flex-wrap:wrap;overflow:visible;row-gap:14px}\n.fx-chip{flex:1 0 104px}\n.fx-step-h{flex-wrap:wrap}\n/* every line on the reading cards and the explanation cards starts with a capital: \"jaws touching\" shows as \"Jaws touching\" */\n.cell .k::first-letter,.cell .v::first-letter,.cell .h::first-letter,.fx-chip small::first-letter,.fx-chip em::first-letter,.fx-delta span::first-letter,.fx-step-h .chg s::first-letter,.fx-step-h .chg strong::first-letter{text-transform:uppercase}\n.fx-step-f{flex-wrap:wrap}\n.actions,.views,.legend,.quick,.flat{z-index:4}\n.tut-card ol li b{color:var(--ink)}\n.tut-mouse{font-size:12.5px;color:var(--muted)}\n/* practice: the explanation always sits under the answer box, across the full width */\n.practice .reading{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}\n.practice .reading .value{width:auto;max-width:560px}\n.practice .pfb{grid-column:1;grid-row:auto}\n\n/* ---- every button is an outline: a border and colored text, never a filled block ---- */\nbutton,.pgo,.pbtn,.ib{background:transparent!important;border:1px solid #3d4147!important;color:var(--ink)!important;box-shadow:none!important}\nbutton:hover,button:focus-visible{border-color:#8a8f97!important;color:#fff!important}\n/* floating buttons over the 3D view keep a faint see-through backing so they stay readable */\n#view .ib,#view .pbtn,.cine .pbtn{background:rgba(10,11,13,.38)!important;border-color:rgba(255,255,255,.34)!important}\n#view .ib:hover,#view .pbtn:hover,.cine .pbtn:hover{border-color:#fff!important}\nbutton.primary,.pgo:not(.alt){border-color:var(--accent)!important;color:var(--accent)!important}\nbutton[aria-pressed=\"true\"],button[aria-checked=\"true\"],#view .ib[aria-pressed=\"true\"],#view .pbtn[aria-pressed=\"true\"],.cine .pbtn[aria-pressed=\"true\"]{border-color:var(--accent)!important;color:var(--accent)!important}\n#lockBtn[aria-pressed=\"true\"],#bezelLockBtn[aria-pressed=\"true\"],#lockQuick[aria-pressed=\"true\"],button.lock[aria-pressed=\"true\"]{border-color:var(--warn)!important;color:var(--warn)!important}\n.tgl[aria-pressed=\"true\"] em{color:var(--accent)!important;opacity:1!important}\n.fcard.sel{background:transparent!important}\n.fhead,.fhead:hover{border:0!important}\nbutton:disabled{opacity:.4}\n\n/* the side panel and the reading panel fold away, leaving the 3D view the whole window */\nbody.side-off .app{grid-template-columns:minmax(0,1fr)!important;grid-template-areas:\"main\"!important}\nbody.side-off aside{display:none!important}\nbody.panel-off .reading,body.panel-off .split{display:none!important}\n.ib .ic-on{display:none}\n.ib[aria-pressed=\"true\"] .ic-off{display:none}\n.ib[aria-pressed=\"true\"] .ic-on{display:inline-block}\n/* even spacing between every row of buttons */\n.grid2,.grid3{gap:6px!important}\n.tgl{margin:0 0 6px!important}\n.units{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 6px}\n.units button{padding:5px 8px;font-size:12.5px}\n.flat.flat-anim{overflow:hidden}\n.flat.flat-anim #flatCv{display:block!important}\nbody.fold-side .app{overflow:hidden}\nbody.fold-side aside{justify-self:end;overflow:hidden;min-width:0}\nbody.fold-panel .reading{overflow:hidden}\nbody.fold-panel .split{display:none}\n/* the status always takes two lines, so a message that wraps doesn't resize the reading bar and shift the cards */\n.reading .status{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;position:relative;padding-left:14px;\n  white-space:normal;overflow:hidden;text-overflow:ellipsis;line-height:1.45;height:2.9em;min-height:0}\n.reading .status::before{position:absolute;left:0;top:calc(.725em - 3.5px)}\n/* dark scrollbars everywhere: a slim rounded thumb, inset by a transparent border so it suits any background */\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-track{background:transparent}\n::-webkit-scrollbar-thumb{background:#2c2f34;background-clip:padding-box;border:3px solid transparent;border-radius:999px;min-height:40px;min-width:40px}\n::-webkit-scrollbar-thumb:hover{background-color:#41454c}\n::-webkit-scrollbar-thumb:active{background-color:#555a62}\n::-webkit-scrollbar-corner{background:transparent}\n@supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin;scrollbar-color:#2c2f34 transparent} }\n/* the reading cards keep one size whatever they say: widths come from the space available, never the text,\n   so which row a card sits on depends only on the window; each line of text has a fixed height */\n@media (min-width:701px){\n  .cell{flex:1 1 0;min-width:96px}\n  .cell.feat{flex:1.3 1 0;min-width:132px;max-width:none}\n  .cell .v,.cell .h,.cell .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45;min-height:1.45em}   /* an empty line still takes its height */\n  .cell.feat .v{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;line-height:1.25;height:2.5em}\n  .cell.feat .h{white-space:nowrap}\n  .reading .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\">\n  \u003caside id=\"panel\">\n    \u003cheader class=\"logo\">\n      \u003ch1 class=\"logo-mark\" id=\"logoMark\" aria-label=\"Dial caliper\">\n        \u003cspan class=\"logo-brk\" aria-hidden=\"true\">[\u003c/span>\n        \u003cspan class=\"logo-stack\" aria-hidden=\"true\">\u003cspan class=\"logo-top\" id=\"logoTop\">Dial\u003c/span>\u003cspan class=\"logo-bot\">Caliper\u003c/span>\u003c/span>\n        \u003cspan class=\"logo-brk\" aria-hidden=\"true\">]\u003c/span>\n      \u003c/h1>\n      \u003cdiv class=\"logo-rule\" aria-hidden=\"true\">\u003c/div>\n      \u003cdiv class=\"logo-foot\">\u003cspan class=\"logo-range\">0–6″ · .001″\u003c/span>\u003cbutton id=\"tutBtn\">\u003ci class=\"fa-solid fa-circle-question\">\u003c/i> Tutorial\u003c/button>\u003c/div>\n    \u003c/header>\n\n    \u003csection class=\"inst-sec\">\n      \u003ch2 id=\"instLbl\">Instrument\u003c/h2>\n      \u003cdiv class=\"seg\" role=\"radiogroup\" aria-labelledby=\"instLbl\">\n        \u003cbutton role=\"radio\" aria-checked=\"true\" data-inst-pick=\"dial\">\u003ci class=\"fa-solid fa-gauge\">\u003c/i>\u003cspan>Dial\u003c/span>\u003c/button>\n        \u003cbutton role=\"radio\" aria-checked=\"false\" data-inst-pick=\"vern\">\u003ci class=\"fa-solid fa-ruler-combined\">\u003c/i>\u003cspan>Vernier\u003c/span>\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2>Slider\u003c/h2>\n      \u003cinput type=\"range\" id=\"slider\" min=\"0\" max=\"6300\" step=\"1\" aria-label=\"Jaw opening\">\n      \u003cbutton class=\"tgl\" id=\"fineBtn\" aria-pressed=\"false\" data-tip=\"Fine adjust&#10;Slows the slider, thumb wheel, bezel and arrow keys down about 10× so the needle creeps instead of jumping.\">\u003ci class=\"fa-solid fa-feather-pointed\">\u003c/i>\u003cspan>Fine adjust\u003c/span>\u003cem>off\u003c/em>\u003c/button>\n      \u003cp class=\"note fine-note\" id=\"fineWin\">\u003c/p>\n      \u003cdiv class=\"units\" role=\"group\" aria-label=\"Units\">\u003cbutton type=\"button\" data-units=\"in\" aria-pressed=\"true\">Inches\u003c/button>\u003cbutton type=\"button\" data-units=\"mm\" aria-pressed=\"false\">Millimeters\u003c/button>\u003c/div>\n      \u003cdiv class=\"grid3\">\n        \u003cbutton data-step=\"-0.1\">−.100\u003c/button>\n        \u003cbutton data-step=\"-0.01\">−.010\u003c/button>\n        \u003cbutton data-step=\"-0.001\">−.001\u003c/button>\n        \u003cbutton data-step=\"0.1\">+.100\u003c/button>\n        \u003cbutton data-step=\"0.01\">+.010\u003c/button>\n        \u003cbutton data-step=\"0.001\">+.001\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cbutton id=\"closeBtn\">Close jaws\u003c/button>\n        \u003cbutton id=\"openBtn\">Open fully\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cbutton id=\"lockBtn\" aria-pressed=\"false\">Lock slider\u003c/button>\n        \u003cbutton id=\"bezelLockBtn\" aria-pressed=\"false\" data-inst=\"dial\">Lock bezel\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cinput type=\"text\" id=\"setTo\" placeholder=\"Go to 1.234\" inputmode=\"decimal\" aria-label=\"Move slider to reading\">\n        \u003cbutton id=\"goBtn\" style=\"flex:0 0 56px\">Go\u003c/button>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection data-inst=\"dial\">\n      \u003ch2>Dial bezel\u003c/h2>\n      \u003cdiv class=\"bezel-val\">\u003cspan>Bezel offset\u003c/span>\u003cb id=\"bezelVal\">0.000″\u003c/b>\u003c/div>\n      \u003cinput type=\"range\" id=\"bezelRange\" min=\"-50\" max=\"50\" step=\"1\" value=\"0\" aria-label=\"Bezel offset in thousandths\">\n      \u003cdiv class=\"row\">\n        \u003cbutton id=\"zeroBtn\">Zero bezel\u003c/button>\n        \u003cbutton id=\"skewBtn\">Random offset\u003c/button>\n      \u003c/div>\n      \u003cp class=\"note\" style=\"margin:8px 0 0\">Close the jaws before measuring. If the needle isn't on 0, turn the bezel until it is, then lock it.\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"sample-sec\">\n      \u003ch2>Part\u003c/h2>\n      \u003cselect id=\"sampleSel\" aria-label=\"Part to measure\">\n        \u003coption value=\"none\">No part\u003c/option>\n        \u003coptgroup label=\"Outside jaws\">\n          \u003coption value=\"pin\">Gauge pin\u003c/option>\n          \u003coption value=\"hex\">Hex bar\u003c/option>\n          \u003coption value=\"block\">Gauge block\u003c/option>\n          \u003coption value=\"ball\">Steel ball\u003c/option>\n          \u003coption value=\"tube\">Aluminum tube\u003c/option>\n        \u003c/optgroup>\n        \u003coptgroup label=\"Inside jaws\">\n          \u003coption value=\"ring\">Ring gauge\u003c/option>\n          \u003coption value=\"bearing\">Ball bearing\u003c/option>\n          \u003coption value=\"slot\">Slotted block\u003c/option>\n          \u003coption value=\"coupling\">Brass coupling\u003c/option>\n        \u003c/optgroup>\n        \u003coptgroup label=\"Depth rod\">\n          \u003coption value=\"pocket\">Pocket block\u003c/option>\n          \u003coption value=\"hole\">Round boss\u003c/option>\n          \u003coption value=\"shoulder\">Shouldered block\u003c/option>\n          \u003coption value=\"channel\">Channel block\u003c/option>\n        \u003c/optgroup>\n      \u003c/select>\n      \u003cdiv class=\"row\">\n        \u003cbutton id=\"newVals\">New random size\u003c/button>\n        \u003cbutton id=\"revealBtn\">Show actual\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"feats\">\u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"answer\">\n      \u003ch2>Highlights\u003c/h2>\n      \u003cdiv class=\"hlcards\">\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-inch)\">\u003cinput type=\"checkbox\" data-hl=\"inch\" checked>\u003cspan>\u003cb>Inch number\u003c/b>\u003csmall>Last whole inch the slider edge has passed\u003c/small>\u003c/span>\u003c/label>\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-tenth)\">\u003cinput type=\"checkbox\" data-hl=\"tenth\" checked>\u003cspan>\u003cb>Tenth line\u003c/b>\u003csmall data-inst=\"dial\">Last 0.100″ line left of the slider edge\u003c/small>\u003csmall data-inst=\"vern\">Last beam digit (0.100″) left of the vernier zero\u003c/small>\u003c/span>\u003c/label>\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-dial)\" data-inst=\"dial\">\u003cinput type=\"checkbox\" data-hl=\"dial\" checked>\u003cspan>\u003cb>Dial reading\u003c/b>\u003csmall>The dial mark under the needle, in thousandths\u003c/small>\u003c/span>\u003c/label>\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-sub)\" data-inst=\"vern\">\u003cinput type=\"checkbox\" data-hl=\"sub\" checked>\u003cspan>\u003cb>0.025″ lines\u003c/b>\u003csmall>Short beam lines passed after that digit\u003c/small>\u003c/span>\u003c/label>\n        \u003clabel class=\"hlcard\" style=\"--c:var(--hl-vern)\" data-inst=\"vern\">\u003cinput type=\"checkbox\" data-hl=\"vern\" checked>\u003cspan>\u003cb>Vernier line\u003c/b>\u003csmall>The vernier line that meets a beam line, in thousandths\u003c/small>\u003c/span>\u003c/label>\n        \u003clabel class=\"hlcard\" style=\"--c:#c9ced4\">\u003cinput type=\"checkbox\" data-hl=\"outline\" checked>\u003cspan>\u003cb>Part outline\u003c/b>\u003csmall>Colored outline around the part being measured\u003c/small>\u003c/span>\u003c/label>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection>\n      \u003ch2>Graphics\u003c/h2>\n      \u003cselect id=\"gfxSel\" aria-label=\"Graphics quality\">\n        \u003coption value=\"high\" selected>High\u003c/option>\n        \u003coption value=\"medium\">Balanced\u003c/option>\n        \u003coption value=\"low\">Low\u003c/option>\n      \u003c/select>\n      \u003cp class=\"note\" id=\"gfxInfo\" style=\"margin:8px 0 0\">Resolution adapts automatically to hold 60 fps.\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"help\">\n      \u003ch2>Reading the caliper\u003c/h2>\n      \u003cdiv data-inst=\"dial\">\n        \u003cp>\u003cb>Beam numbers\u003c/b> are whole inches. Each \u003cb>line\u003c/b> between them is 0.100″. Read the last line to the left of the slider edge.\u003c/p>\n        \u003cp>\u003cb>The dial\u003c/b> adds thousandths: each mark is 0.001″ and one full turn of the needle is 0.100″.\u003c/p>\n        \u003cp>\u003cb>Reading\u003c/b> = inches + tenths + dial. For example 1″ + 0.300″ + 0.047″ = 1.347″.\u003c/p>\n        \u003cp>\u003cb>Mouse:\u003c/b> drag the slider, dial or thumb wheel to move the jaws, scroll over the thumb wheel for 0.001″ steps, drag the knurled bezel to turn the dial face, and click a lock screw to lock it. Shift for fine control.\u003c/p>\n      \u003c/div>\n      \u003cdiv data-inst=\"vern\">\n        \u003cp>\u003cb>Beam numbers\u003c/b> are whole inches and the \u003cb>small digits\u003c/b> are 0.100″. The \u003cb>short lines\u003c/b> between digits are 0.025″ each. Read them all at the vernier's 0 line.\u003c/p>\n        \u003cp>\u003cb>The vernier\u003c/b> adds thousandths: find the one vernier line that meets a beam line exactly. Its number is the thousandths, 0 to 24.\u003c/p>\n        \u003cp>\u003cb>Reading\u003c/b> = inches + tenths + 0.025″ lines + vernier. For example 1″ + 0.300″ + 0.050″ + 0.012″ = 1.362″.\u003c/p>\n        \u003cp>\u003cb>Mouse:\u003c/b> drag the slider or thumb wheel to move the jaws, scroll over the thumb wheel for 0.001″ steps, and click the lock screw to lock it. Shift for fine control.\u003c/p>\n      \u003c/div>\n      \u003cp>\u003cb>Fine adjust\u003c/b> slows every control down about 10×: the slider covers a 0.100″ window, the wheel steps 0.0001″, and the needle creeps between marks instead of jumping.\u003c/p>\n      \u003cp>\u003cb>Keys:\u003c/b> ←→ 0.001″ (0.0001″ in fine adjust), Shift+←→ 0.010″, PgUp/PgDn 0.100″, F fine adjust, L lock slider, \u003cspan data-inst=\"dial\">B lock bezel, Z zero bezel, \u003c/span>A auto measure, Esc dismiss.\u003c/p>\n    \u003c/section>\n  \u003c/aside>\n\n  \u003cmain>\n    \u003cdiv id=\"view\">\n      \u003cdiv class=\"loading\" id=\"loading\">\u003cdiv class=\"ld\">\u003cspan class=\"ld-t\" id=\"ldT\">Loading the 3D engine…\u003c/span>\u003cdiv class=\"ld-bar\" role=\"progressbar\" aria-label=\"Loading\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"0\">\u003ci id=\"ldFill\">\u003c/i>\u003c/div>\u003cspan class=\"ld-p\" id=\"ldP\">0%\u003c/span>\u003c/div>\u003c/div>\n      \u003cscript>\n      // runs as the page is read, before the 3D engine downloads: the bar creeps toward a cap as files arrive,\n      // and __load.set() moves it (and the cap) on at each real step; __load.done() fills it and fades it out\n      (function(){\n        var fill = document.getElementById('ldFill'), bar = fill.parentNode, pct = document.getElementById('ldP'), txt = document.getElementById('ldT');\n        var p = 0.03, cap = 0.5, done = false;\n        function draw(){ fill.style.transform = 'scaleX(' + p + ')'; var n = Math.round(p*100); pct.textContent = n + '%'; bar.setAttribute('aria-valuenow', n); }\n        function set(v, label){ if (done) return; p = Math.max(p, v); cap = Math.max(cap, Math.min(0.97, v + 0.3)); if (label) txt.textContent = label; draw(); }\n        var timer = setInterval(function(){ if (!done){ p += (cap - p)*0.05; draw(); } }, 120);\n        try { new PerformanceObserver(function(list){ list.getEntries().forEach(function(){ p += (cap - p)*0.25; }); if (!done) draw(); }).observe({ type: 'resource', buffered: true }); } catch (e) {}\n        window.__load = { set: set, done: function(){\n          if (done) return; set(1, 'Ready'); done = true; clearInterval(timer);\n          var el = document.getElementById('loading'); el.classList.add('ld-out'); setTimeout(function(){ el.remove(); }, 350);\n        } };\n        draw();\n      })();\n      \u003c/script>\n      \u003cdiv class=\"actions\">\n        \u003cbutton class=\"ib\" id=\"sideBtn\" aria-pressed=\"false\" aria-label=\"Hide the side panel\" data-tip=\"Hide the side panel&#10;Gives the 3D view the whole width.\">\u003ci class=\"fa-solid fa-angles-left ic-off\">\u003c/i>\u003ci class=\"fa-solid fa-angles-right ic-on\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" id=\"autoBtn\" aria-label=\"Auto measure\" data-tip=\"Auto measure&#10;Opens the jaws, then closes them gently on the part.\">\u003ci class=\"fa-solid fa-wand-magic-sparkles\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"examBtn\" data-tip=\"Examination&#10;Cinematic tour with labels on every part. Rotate, pan and zoom freely.\">\u003ci class=\"fa-solid fa-binoculars\">\u003c/i>\u003cspan>Examine\u003c/span>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"practiceBtn\" aria-pressed=\"false\" data-tip=\"Practice reading&#10;Hides the answers, picks a random part and size, and puts an answer box in the reading bar.\">\u003ci class=\"fa-solid fa-graduation-cap\">\u003c/i>\u003cspan>Practice\u003c/span>\u003c/button>\n        \u003cbutton class=\"ib\" id=\"pullBtn\" aria-label=\"Remove part\" data-tip=\"Remove part&#10;Takes the part off the caliper.\">\u003ci class=\"fa-solid fa-arrow-right-from-bracket\">\u003c/i>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"views\" role=\"group\" aria-label=\"Camera views\">\n        \u003cbutton class=\"ib\" data-view=\"iso\" aria-label=\"Iso view\" data-tip=\"Iso view&#10;Angled overview of the whole caliper.\">\u003ci class=\"fa-solid fa-cube\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" data-view=\"front\" aria-label=\"Front view\" data-tip=\"Front view&#10;Straight-on view of the caliper.\">\u003ci class=\"fa-solid fa-vector-square\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" data-view=\"scale\" aria-label=\"Scale view\" data-tip=\"Scale view&#10;Close-up of the beam scale at the slider edge.\">\u003ci class=\"fa-solid fa-ruler-horizontal\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" data-view=\"dial\" id=\"fineViewBtn\" aria-label=\"Dial view\" data-tip=\"Dial view&#10;Close-up of the dial and needle.\">\u003cspan class=\"ic-dial\">\u003ci class=\"fa-solid fa-gauge\">\u003c/i>\u003c/span>\u003cspan class=\"ic-vern\">\u003ci class=\"fa-solid fa-ruler-combined\">\u003c/i>\u003c/span>\u003c/button>\n        \u003cbutton class=\"ib\" data-view=\"jaws\" aria-label=\"Jaws view\" data-tip=\"Jaws view&#10;Close-up of the jaws or depth rod on the part.\">\u003ci class=\"fa-solid fa-magnifying-glass-plus\">\u003c/i>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"xlayer\" id=\"xlayer\" aria-hidden=\"true\">\u003csvg id=\"xsvg\">\u003c/svg>\u003c/div>\n      \u003cdiv class=\"cine top\">\u003cspan class=\"ct\">Examination\u003c/span>\u003cdiv class=\"cc\">\n        \u003cbutton class=\"pbtn\" id=\"spinBtn\" aria-pressed=\"true\" aria-label=\"Auto-rotate\">\u003ci class=\"fa-solid fa-rotate\">\u003c/i>\u003cspan>Auto-rotate\u003c/span>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"labelsBtn\" aria-pressed=\"true\" aria-label=\"Labels\">\u003ci class=\"fa-solid fa-tags\">\u003c/i>\u003cspan>Labels\u003c/span>\u003c/button>\n        \u003cbutton class=\"pbtn\" id=\"exitExam\" aria-label=\"Exit examination\">\u003ci class=\"fa-solid fa-xmark\">\u003c/i>\u003cspan>Exit\u003c/span>\u003c/button>\u003c/div>\u003c/div>\n      \u003cdiv class=\"cine bot\">\u003cspan class=\"hint\">\u003cspan class=\"m-only\">Left-drag to rotate · right-drag to pan · scroll to zoom\u003c/span>\u003cspan class=\"t-only\">Drag to rotate · two fingers to pan · pinch to zoom\u003c/span> · Esc to exit\u003c/span>\u003c/div>\n      \u003cdiv class=\"coach\" aria-hidden=\"true\">\u003c/div>\n      \u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n      \u003cdiv class=\"legend\" aria-label=\"Mouse controls\">\n        \u003cspan class=\"mk\">\u003cspan class=\"mouse l\" aria-hidden=\"true\">\u003ci class=\"fa-solid fa-computer-mouse\">\u003c/i>\u003cb>\u003c/b>\u003c/span>Rotate\u003c/span>\n        \u003cspan class=\"mk\">\u003cspan class=\"mouse r\" aria-hidden=\"true\">\u003ci class=\"fa-solid fa-computer-mouse\">\u003c/i>\u003cb>\u003c/b>\u003c/span>Pan\u003c/span>\n        \u003cspan class=\"mk\">\u003cspan class=\"mouse m\" aria-hidden=\"true\">\u003ci class=\"fa-solid fa-computer-mouse\">\u003c/i>\u003cb>\u003c/b>\u003c/span>Zoom\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"quick\" role=\"group\" aria-label=\"Slider controls\">\n        \u003cbutton class=\"ib\" id=\"panelBtn\" aria-pressed=\"false\" aria-label=\"Hide the reading panel\" data-tip=\"Hide the reading panel&#10;Gives the 3D view the whole height.\">\u003ci class=\"fa-solid fa-angles-down ic-off\">\u003c/i>\u003ci class=\"fa-solid fa-angles-up ic-on\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" id=\"closeQuick\" aria-label=\"Close jaws\" data-tip=\"Close jaws&#10;Closes the jaws, or until they touch the part.\">\u003ci class=\"fa-solid fa-down-left-and-up-right-to-center\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" id=\"openQuick\" aria-label=\"Open fully\" data-tip=\"Open fully&#10;Opens the jaws as far as they go.\">\u003ci class=\"fa-solid fa-up-right-and-down-left-from-center\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" id=\"lockQuick\" aria-label=\"Lock slider\" aria-pressed=\"false\" data-tip=\"Lock slider&#10;Tightens the lock screw so the slider can’t move.\">\u003ci class=\"fa-solid fa-lock-open ic-off\">\u003c/i>\u003ci class=\"fa-solid fa-lock ic-on\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"ib\" id=\"fineQuick\" aria-label=\"Fine adjust\" aria-pressed=\"false\" data-tip=\"Fine adjust&#10;Slows the slider, thumb wheel, bezel and arrow keys down about 10× for hairline moves.\">\u003ci class=\"fa-solid fa-feather-pointed\">\u003c/i>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"flat\" id=\"flat\">\n        \u003cdiv class=\"flat-h\">\u003cspan id=\"flatTitle\">Beam &amp; dial, flat view\u003c/span>\u003cbutton class=\"ib sm\" id=\"flatBtn\" aria-label=\"Hide flat view\" aria-expanded=\"true\" data-tip=\"Hide flat view\">\u003ci class=\"fa-solid fa-eye-slash ic-on\">\u003c/i>\u003ci class=\"fa-solid fa-eye ic-off\">\u003c/i>\u003c/button>\u003c/div>\n        \u003ccanvas id=\"flatCv\" width=\"260\" height=\"280\" role=\"img\" aria-label=\"Beam scale at the slider edge and the dial face\">\u003c/canvas>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"flat-dock\" id=\"flatDock\">\u003c/div>\n    \u003cdiv class=\"split\" id=\"split\" role=\"separator\" aria-orientation=\"horizontal\" aria-label=\"Resize the reading panel\" tabindex=\"0\">\u003cspan>\u003c/span>\u003c/div>\n    \u003csection class=\"reading\" id=\"reading\" aria-live=\"polite\">\n      \u003cdiv class=\"value\">\n        \u003cdiv class=\"answer\">\u003cspan class=\"num\" id=\"lcd\">1.000\u003c/span>\u003cspan class=\"unit\">in\u003c/span>\u003cspan class=\"mm\" id=\"lcdmm\">\u003c/span>\u003c/div>\n        \u003cdiv class=\"pract\">\n          \u003cdiv class=\"ptools\" role=\"group\" aria-label=\"Practice with\">\n            \u003cspan class=\"pl\">Practice with\u003c/span>\n            \u003cbutton type=\"button\" class=\"ptool\" data-ptool=\"od\" aria-pressed=\"true\">Outside jaws\u003c/button>\n            \u003cbutton type=\"button\" class=\"ptool\" data-ptool=\"id\" aria-pressed=\"true\">Inside jaws\u003c/button>\n            \u003cbutton type=\"button\" class=\"ptool\" data-ptool=\"depth\" aria-pressed=\"true\">Depth rod\u003c/button>\n          \u003c/div>\n          \u003clabel class=\"pl\" for=\"guess\">Your reading\u003c/label>\n          \u003cdiv class=\"prow\">\n            \u003cinput type=\"text\" id=\"guess\" placeholder=\"0.000\" inputmode=\"decimal\" autocomplete=\"off\" aria-describedby=\"feedback\">\n            \u003cbutton class=\"pgo\" id=\"checkBtn\">\u003ci class=\"fa-solid fa-check\">\u003c/i>\u003cspan>Check\u003c/span>\u003c/button>\n            \u003cbutton class=\"pgo alt\" id=\"randomBtn\" data-tip=\"Next part&#10;Random part and size, using the tools picked above.\">\u003ci class=\"fa-solid fa-shuffle\">\u003c/i>\u003cspan>Next\u003c/span>\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"status\" id=\"status\">Slider free\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"bd\">\n        \u003cdiv class=\"cell feat\" id=\"featCell\">\u003cspan class=\"k\" id=\"fK\">Measuring\u003c/span>\u003cspan class=\"v\" id=\"fV\">—\u003c/span>\u003cspan class=\"h\" id=\"fH\">\u003c/span>\u003c/div>\n        \u003cdiv class=\"cell answer\" data-c=\"inch\">\u003cspan class=\"k\">Inches\u003c/span>\u003cspan class=\"v\" id=\"vA\">\u003c/span>\u003cspan class=\"h\" id=\"hA\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op answer\">+\u003c/span>\n        \u003cdiv class=\"cell answer\" data-c=\"tenth\">\u003cspan class=\"k\">Tenths\u003c/span>\u003cspan class=\"v\" id=\"vB\">\u003c/span>\u003cspan class=\"h\" id=\"hB\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op answer\" data-inst=\"dial\">+\u003c/span>\n        \u003cdiv class=\"cell answer\" data-c=\"dial\" data-inst=\"dial\">\u003cspan class=\"k\">Dial\u003c/span>\u003cspan class=\"v\" id=\"vC\">\u003c/span>\u003cspan class=\"h\" id=\"hC\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op answer\" data-inst=\"vern\">+\u003c/span>\n        \u003cdiv class=\"cell answer\" data-c=\"sub\" data-inst=\"vern\">\u003cspan class=\"k\">0.025″ lines\u003c/span>\u003cspan class=\"v\" id=\"vS\">\u003c/span>\u003cspan class=\"h\" id=\"hS\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op answer\" data-inst=\"vern\">+\u003c/span>\n        \u003cdiv class=\"cell answer\" data-c=\"vern\" data-inst=\"vern\">\u003cspan class=\"k\">Vernier\u003c/span>\u003cspan class=\"v\" id=\"vV\">\u003c/span>\u003cspan class=\"h\" id=\"hV\">\u003c/span>\u003c/div>\n        \u003cspan class=\"op answer\">=\u003c/span>\n        \u003cdiv class=\"cell total answer\">\u003cspan class=\"k\">Reading\u003c/span>\u003cspan class=\"v\" id=\"vT\">\u003c/span>\u003cspan class=\"h\">inches\u003c/span>\u003c/div>\n        \u003cdiv class=\"cell answer\" data-c=\"bezel\" id=\"bezelCell\" hidden>\u003cspan class=\"k\">Bezel error\u003c/span>\u003cspan class=\"v\" id=\"vD\">\u003c/span>\u003cspan class=\"h\">zero the bezel\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"meta answer\">Actual jaw opening \u003cb id=\"gap\">\u003c/b>\u003c/div>\n      \u003cdiv class=\"pfb\" id=\"feedback\" role=\"status\" aria-live=\"polite\">\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\u003c/div>\n\n\u003cdiv class=\"tut\" id=\"tut\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tutTitle\" hidden>\n  \u003cdiv class=\"tut-card\">\n    \u003ch3 id=\"tutTitle\">Welcome to the caliper!\u003c/h3>\n    \u003cp data-inst=\"dial\">This is a working dial caliper. It measures things up to 6 inches, like the outside of a pin, the inside of a ring, or the depth of a hole.\u003c/p>\n    \u003cp data-inst=\"vern\">This is a working vernier caliper. It measures things up to 6 inches, like the outside of a pin, the inside of a ring, or the depth of a hole.\u003c/p>\n    \u003cp class=\"tut-mouse\">\u003cb>Using the mouse:\u003c/b> To \u003cb>click\u003c/b>, press the left mouse button once. To \u003cb>drag\u003c/b>, hold the left mouse button down, move the mouse, and then let go.\u003c/p>\n    \u003col>\n      \u003cli>\u003cb>Choosing a caliper.\u003c/b> Under “Instrument” on the left, pick “Dial” or “Vernier.” You can switch at any time.\u003c/li>\n      \u003cli>\u003cb>Picking something to measure.\u003c/b> Choose a part from the “Part” list on the left. It appears in the right spot on the caliper by itself.\u003c/li>\n      \u003cli>\u003cb>Measuring it for you.\u003c/b> Click the magic wand button above the picture, and the caliper closes gently onto the part.\u003c/li>\n      \u003cli>\u003cb>Moving the jaws yourself.\u003c/b> Drag the sliding part of the caliper, or roll the little wheel under it. The + and − buttons on the left move it by exact amounts.\u003c/li>\n      \u003cli>\u003cb>Moving very slowly.\u003c/b> Turn on “Fine adjust” when you want the jaws to creep along a tiny bit at a time.\u003c/li>\n      \u003cli data-inst=\"dial\">\u003cb>Setting zero.\u003c/b> Close the jaws all the way. If the needle is not on 0, drag the ring around the dial until it is.\u003c/li>\n      \u003cli data-inst=\"vern\">\u003cb>Checking zero.\u003c/b> Close the jaws all the way. The 0 on the sliding scale should line up exactly with a line on the long scale.\u003c/li>\n      \u003cli>\u003cb>Locking it.\u003c/b> Click one of the small round lock screws. It turns red while it is locked, and it stays red until you click it again.\u003c/li>\n      \u003cli data-inst=\"dial\">\u003cb>Reading it.\u003c/b> Add three things together: the last big number you passed, the small lines after it (0.100″ each), and the number the needle points to (0.001″ each).\u003c/li>\n      \u003cli data-inst=\"vern\">\u003cb>Reading it.\u003c/b> Add the last big number you passed, the small numbers after it (0.100″ each), the tiny lines after that (0.025″ each), and the sliding-scale line that lines up perfectly (0.001″ each).\u003c/li>\n      \u003cli>\u003cb>Using the flat view.\u003c/b> The small card in the corner shows the scales flat and straight on, so they are easier to read.\u003c/li>\n      \u003cli>\u003cb>Practicing.\u003c/b> Click “Practice,” choose which jaws you want to practice with, type what you read, and click “Check.” It shows you exactly what was right and what to fix.\u003c/li>\n      \u003cli>\u003cb>Learning the parts.\u003c/b> Click “Examine” to see the caliper turn slowly with the name of every part on it.\u003c/li>\n      \u003cli>\u003cb>Looking around.\u003c/b> \u003cspan class=\"m-only\">Drag an empty part of the picture to turn the view. Hold the right mouse button and move the mouse to slide the view. Roll the mouse wheel to zoom in and out.\u003c/span>\u003cspan class=\"t-only\">Drag with one finger to turn the view. Drag with two fingers to slide it. Pinch to zoom in and out.\u003c/span>\u003c/li>\n    \u003c/ol>\n    \u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"tutClose\">Start measuring\u003c/button>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js\">\u003c/script>\n\u003cscript type=\"importmap\">\n{ \"imports\": {\n  \"three\": \"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js\",\n  \"three/addons/\": \"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/\"\n} }\n\u003c/script>\n\u003cscript type=\"module\">\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\nimport { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';\nimport { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\nwindow.__load && window.__load.set(0.55, 'Building the caliper…');\n\nconst T = THREE;\nconst $ = id => document.getElementById(id);\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst TAU = Math.PI * 2;\nconst cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n\nconst state = {\n  pos: 1.0,              // true jaw opening (inches)\n  bezel: 0,              // bezel rotation (radians, CCW positive)\n  sliderLocked: false, bezelLocked: false, cut: false, secT: 0.5, secAxis: '+z',\n  animQ: [],             // queued slider targets: { to, speed }\n  practice: false, pRevealed: false, pErr: [], exam: false,\n  pScore: { right: 0, total: 0, streak: 0 },\n  hl: { inch: true, tenth: true, dial: true, sub: true, vern: true, outline: true },\n  revealed: false,\n  inst: 'dial',          // which instrument is on the bench: 'dial' or 'vern'\n  fine: false            // fine adjustment: every control moves the needle ~10x slower\n};\n// how much slower each input runs in fine mode\nconst FINE = { drag: 0.09, bezel: 0.13, wheel: 0.0001, key: 0.0001, keyBig: 0.001, window: 0.05 };\n\n/* ---------- renderer ---------- */\nconst wrap = $('view');\nconst renderer = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });\nrenderer.setClearColor(0x000000, 0);\nrenderer.outputColorSpace = T.SRGBColorSpace;\nrenderer.toneMapping = T.NeutralToneMapping;\nrenderer.toneMappingExposure = 0.9;\nrenderer.shadowMap.enabled = true;\nrenderer.shadowMap.type = T.PCFSoftShadowMap;\nrenderer.domElement.tabIndex = 0;\nrenderer.domElement.className = 'gl';\nwrap.appendChild(renderer.domElement);\nconst canvas = renderer.domElement;\nconst MAX_ANISO = renderer.capabilities.getMaxAnisotropy();\nrenderer.localClippingEnabled = true;\n\nconst GFX = {\n  high:   { maxDpr: Math.min(window.devicePixelRatio || 1, 2), shadows: true, map: 2048 },\n  medium: { maxDpr: Math.min(window.devicePixelRatio || 1, 1.25), shadows: true, map: 1024 },\n  low:    { maxDpr: 0.85, shadows: false, map: 1024 }\n};\nlet gfx = GFX.high, dprCur = gfx.maxDpr, dprCeil = gfx.maxDpr;\n\n\n/* ---------- shop finish: real tools are satin and handled, not mirror-bright ----------\n   Every lit material in the scene gets this once: chrome and lapped faces become satin, bare metal\n   picks up fine scratches and handling marks, reflections are toned down, paint is a dull satin.\n   Materials that glow on purpose (locked parts, highlights) are left alone. */\nconst WEAR_TEX = (() => {\n  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;\n  const g = c.getContext('2d');\n  g.fillStyle = 'rgb(222,222,222)'; g.fillRect(0, 0, s, s);\n  // fine scratches from handling and cleaning\n  for (let i = 0; i \u003c 900; i++){\n    const x = Math.random()*s, y = Math.random()*s, a = (Math.random() \u003c 0.6 ? 0.1 : Math.PI/2) + (Math.random() - 0.5)*0.5, L = 6 + Math.random()*40;\n    const v = Math.random() \u003c 0.5 ? 255 : 170;\n    g.strokeStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.15 + Math.random()*0.3) + ')'; g.lineWidth = 0.6 + Math.random()*0.8;\n    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*L, y + Math.sin(a)*L); g.stroke();\n  }\n  // smudges and worn patches\n  for (let i = 0; i \u003c 70; i++){\n    const x = Math.random()*s, y = Math.random()*s, r = 10 + Math.random()*55, v = Math.random() \u003c 0.5 ? 255 : 175;\n    const gr = g.createRadialGradient(x, y, 0, x, y, r);\n    gr.addColorStop(0, 'rgba(' + v + ',' + v + ',' + v + ',0.35)'); gr.addColorStop(1, 'rgba(' + v + ',' + v + ',' + v + ',0)');\n    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();\n  }\n  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.anisotropy = 4;\n  return t;\n})();\nconst _finished = new WeakSet();\nfunction shopFinish(root){\n  root.traverse(o => {\n    if (!o.isMesh) return;\n    for (const m of Array.isArray(o.material) ? o.material : [o.material]){\n      if (!m || _finished.has(m) || !m.isMeshStandardMaterial || m.transparent) continue;\n      _finished.add(m);\n      if (m.emissive && m.emissive.getHex() !== 0 && m.emissiveIntensity > 0) continue;   // meant to glow\n      if (m.metalness >= 0.6){\n        m.roughness = Math.min(0.85, Math.max(m.roughness, 0.32) + 0.06);\n        m.color.multiplyScalar(0.8);\n        if (!m.roughnessMap){ m.roughnessMap = WEAR_TEX; m.roughness = Math.min(1, m.roughness/0.88); }\n      } else m.roughness = Math.max(m.roughness, 0.58);\n      m.envMapIntensity = (m.envMapIntensity == null ? 1 : m.envMapIntensity)*0.75;\n      m.needsUpdate = true;\n    }\n  });\n}\n\nconst scene = new T.Scene();\nconst pmrem = new T.PMREMGenerator(renderer);\nscene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;\nscene.environmentIntensity = 0.55;\n\nconst camera = new T.PerspectiveCamera(30, 1, 0.05, 300);\n\nconst CENTER = new T.Vector3(3.9, -0.45, 0);\nscene.add(new T.HemisphereLight(0xffffff, 0x9aa2aa, 0.35));\nconst key = new T.DirectionalLight(0xffffff, 1.9);\nkey.shadow.bias = -0.0004; key.shadow.normalBias = 0.01; key.shadow.intensity = 0.7;\nObject.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 0.5, far: 60 });\nconst fill = new T.DirectionalLight(0xffffff, 0.45);\nconst rim = new T.DirectionalLight(0xffffff, 0.7);\nkey.position.copy(CENTER).add(new T.Vector3(-4, 9, 14));\nfill.position.copy(CENTER).add(new T.Vector3(8, -2, 12));\nrim.position.copy(CENTER).add(new T.Vector3(2, 6, -12));\n[key, fill, rim].forEach(l => { l.target.position.copy(CENTER); scene.add(l, l.target); });\nconst ground = new T.Mesh(new T.PlaneGeometry(80, 80), new T.ShadowMaterial({ opacity: 0.35 }));\nground.rotation.x = -Math.PI / 2; ground.position.set(CENTER.x, -2.9, 0); ground.receiveShadow = true;\nscene.add(ground);\n\nfunction resize() {\n  const w = Math.max(1, wrap.clientWidth), h = Math.max(1, wrap.clientHeight);\n  renderer.setPixelRatio(dprCur);\n  renderer.setSize(w, h, false);\n  camera.aspect = w / h;\n  camera.updateProjectionMatrix();\n  // resizing clears the canvas, so draw straight away rather than show a blank frame\n  if (controls) renderer.render(scene, camera);\n}\nnew ResizeObserver(resize).observe(wrap);\n\nfunction applyGfx(name) {\n  gfx = GFX[name]; dprCur = dprCeil = gfx.maxDpr;\n  key.castShadow = gfx.shadows; ground.visible = gfx.shadows;\n  if (key.shadow.map) { key.shadow.map.dispose(); key.shadow.map = null; }\n  key.shadow.mapSize.set(gfx.map, gfx.map);\n  resize(); updateGfxInfo();\n}\nfunction updateGfxInfo() { $('gfxInfo').textContent = `Render scale ${Math.round(dprCur * 100)}% · adapts automatically to hold 60 fps.`; }\n\n/* ------------------------------------------------------------------ textures */\nfunction brushedTexture(base, spread, color) {\n  const c = document.createElement('canvas'); c.width = c.height = 1024;\n  const g = c.getContext('2d');\n  g.fillStyle = `rgb(${base},${base},${base})`; g.fillRect(0, 0, 1024, 1024);\n  for (let i = 0; i \u003c 9000; i++) {\n    const y = Math.random() * 1024, x0 = Math.random() * 1024, len = 60 + Math.random() * 800;\n    const v = clamp(base + (Math.random() * 2 - 1) * spread, 0, 255) | 0;\n    g.strokeStyle = `rgba(${v},${v},${v},${0.25 + Math.random() * 0.45})`;\n    g.lineWidth = 0.4 + Math.random() * 1.3;\n    g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + len, y); g.stroke();\n    if (x0 + len > 1024) { g.beginPath(); g.moveTo(x0 - 1024, y); g.lineTo(x0 + len - 1024, y); g.stroke(); }\n  }\n  const t = new THREE.CanvasTexture(c);\n  t.wrapS = t.wrapT = THREE.RepeatWrapping;\n  t.anisotropy = MAX_ANISO;\n  if (color) t.colorSpace = THREE.SRGBColorSpace;\n  return t;\n}\nfunction rotated(tex) {\n  const t = tex.clone(); t.center.set(0.5, 0.5); t.rotation = Math.PI / 2; t.needsUpdate = true; return t;\n}\nconst brushMap = brushedTexture(205, 38, true);\nconst brushRough = brushedTexture(95, 65, false);\n\n/* ------------------------------------------------------------------ materials */\nconst steel = new THREE.MeshStandardMaterial({ color: 0xc4c8cc, metalness: 0.92, roughness: 1, map: brushMap, roughnessMap: brushRough, bumpMap: brushRough, bumpScale: 0.3 });\nconst steelV = steel.clone(); steelV.map = rotated(brushMap); steelV.roughnessMap = rotated(brushRough); steelV.bumpMap = steelV.roughnessMap;\nconst steelSlider = steel.clone(); steelSlider.color = new THREE.Color(0xbcc0c4);\nconst knife = new THREE.MeshStandardMaterial({ color: 0x8d9197, metalness: 0.95, roughness: 0.18 });\nconst chrome = new THREE.MeshStandardMaterial({ color: 0xc8cbce, metalness: 1, roughness: 0.22, side: THREE.DoubleSide });\nconst chromeSatin = new THREE.MeshStandardMaterial({ color: 0xb4b8bc, metalness: 1, roughness: 0.35, side: THREE.DoubleSide });\n// bezel ring: brushed rather than mirror, so the knurl reads as texture instead of a band of glare\nconst bezelChrome = new THREE.MeshStandardMaterial({ color: 0xb0b4b8, metalness: 1, roughness: 0.42, envMapIntensity: 0.7, side: THREE.DoubleSide });\nconst casting = new THREE.MeshStandardMaterial({ color: 0x6c7176, metalness: 0.7, roughness: 0.55 });\nconst rackMat = new THREE.MeshStandardMaterial({ color: 0xa9adb2, metalness: 0.95, roughness: 0.3 });\nconst blackGloss = new THREE.MeshStandardMaterial({ color: 0x131416, metalness: 0.1, roughness: 0.62, envMapIntensity: 0.5 });\nconst slotInk = new THREE.MeshStandardMaterial({ color: 0x33363a, roughness: 0.8 });\n\n/* ------------------------------------------------------------------ geometry helpers */\nfunction mesh(g, m) { const o = new THREE.Mesh(g, m); o.castShadow = o.receiveShadow = true; return o; }\nfunction shapeFrom(pts) {\n  const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]);\n  for (let i = 1; i \u003c pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);\n  return s;\n}\n// extrude a polygon (x,y inches) between z0 and z1, with a small edge bevel kept inside the outline\nfunction prism(pts, z0, z1, mat, bevel = 0.008) {\n  const b = Math.min(bevel, (z1 - z0) * 0.3);\n  const g = new THREE.ExtrudeGeometry(shapeFrom(pts), {\n    depth: (z1 - z0) - 2 * b, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelOffset: -b, bevelSegments: 2, curveSegments: 1\n  });\n  g.translate(0, 0, z0 + b);\n  return mesh(g, mat);\n}\nfunction box(x0, x1, y0, y1, z0, z1, mat, bevel) { return prism([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], z0, z1, mat, bevel); }\n// polygon whose half-thickness varies per vertex -> knife-edge jaw tips\nfunction taper(pts, zc, halfFn, capMat, sideMat) {\n  const g = new THREE.ExtrudeGeometry(shapeFrom(pts), { depth: 1, bevelEnabled: false });\n  const p = g.attributes.position;\n  for (let i = 0; i \u003c p.count; i++) {\n    const h = halfFn(p.getX(i), p.getY(i));\n    p.setZ(i, zc + (p.getZ(i) > 0.5 ? h : -h));\n  }\n  g.computeVertexNormals();\n  return mesh(g, [capMat, sideMat]);\n}\n// flat chamfer facet: each polygon corner gets its own half-thickness, giving a crisp ground bevel\nfunction facet(pts, hs, zc, capMat, sideMat) {\n  return taper(pts, zc, (x, y) => {\n    let best = 0, bd = Infinity;\n    pts.forEach((p, i) => { const d = (p[0] - x) ** 2 + (p[1] - y) ** 2; if (d \u003c bd) { bd = d; best = i; } });\n    return hs[best];\n  }, capMat, sideMat);\n}\n// lathe around Y; vertices in the knurl band alternate outward to form knurl ridges\nfunction knurled(profile, knurlIdx, amp, segs, mat) {\n  const g = new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), segs);\n  const p = g.attributes.position, n = profile.length;\n  for (let i = 0; i \u003c= segs; i += 2) for (const j of knurlIdx) {\n    const k = i * n + j, x = p.getX(k), z = p.getZ(k), r = Math.hypot(x, z);\n    if (r > 1e-6) { const s = (r + amp) / r; p.setX(k, x * s); p.setZ(k, z * s); }\n  }\n  g.computeVertexNormals();\n  return mesh(g, mat);\n}\nfunction lathe(profile, mat, segs = 96) {\n  return mesh(new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), segs), mat);\n}\nfunction cylZ(r, z0, z1, mat, seg = 48) {\n  const g = new THREE.CylinderGeometry(r, r, z1 - z0, seg); g.rotateX(Math.PI / 2); g.translate(0, 0, (z0 + z1) / 2);\n  return mesh(g, mat);\n}\n// Phillips pan-head screw facing +z\nfunction screw(x, y, z, r) {\n  const grp = new THREE.Group();\n  const cap = Math.PI * 0.32, cosC = Math.cos(cap);\n  const head = new THREE.SphereGeometry(r, 32, 12, 0, TAU, 0, cap);\n  head.rotateX(Math.PI / 2); head.translate(0, 0, -r * cosC);\n  grp.add(mesh(head, chromeSatin));\n  const dome = r * (1 - cosC);\n  const s1 = mesh(new THREE.BoxGeometry(r * 1.2, r * 0.22, dome * 0.9), slotInk); s1.position.z = dome * 0.7;\n  const s2 = s1.clone(); s2.rotation.z = Math.PI / 2;\n  grp.add(s1, s2);\n  grp.position.set(x, y, z);\n  return grp;\n}\n\n/* ------------------------------------------------------------------ dimensions (inches) */\nconst BT = 0.07;             // half beam thickness\nconst XL = -0.8, XR = 8.75; // beam ends; x = 0 is the fixed outside-jaw face\nconst TRAVEL = 6.3;\nconst ID_FACE = -0.5;       // fixed inside-jaw measuring face; moving face sits at pos + ID_FACE\nconst ROD_Y = 0.16, ROD_Z = -0.045;\n\nconst cal = new THREE.Group();\ncal.rotation.z = 0;\nscene.add(cal);\n\n/* ------------------------------------------------------------------ beam + fixed jaws */\nconst beam = new THREE.Group(); cal.add(beam);\n// instrument-specific parts: only one of each pair is visible at a time (see setInst)\nconst beamDial = new THREE.Group(), beamVern = new THREE.Group();\nbeam.add(beamDial, beamVern);\nconst BEAM_TAIL = [\n  [XL, 0.31], [XL, -0.42], [-0.64, -0.52], [-0.5, -1.35], [-0.29, -1.7], [0, -1.55],\n  [0, -0.46], [-0.045, -0.43], [-0.045, -0.37], [0, -0.34], [0, -0.31]\n];\n// dial caliper: channel down the middle for the rack\nbeamDial.add(prism([[XR, -0.31], [XR, 0.07], [0.25, 0.07], [0.25, 0.25], [XR, 0.25], [XR, 0.31], ...BEAM_TAIL], -BT, BT, steel));\n// vernier caliper: solid bar, so the whole front face carries the scale\nbeamVern.add(prism([[XR, -0.31], [XR, 0.31], ...BEAM_TAIL], -BT, BT, steel));\nbeamDial.add(box(0.25, XR, 0.07, 0.25, -0.02, 0.02, steel, 0));     // channel web\nbeamDial.add(box(8.1, XR, 0.07, 0.25, 0.02, BT, steel, 0));          // front fill under end plate\n// outside-jaw tip: ground ramp on the inner side running down to a knife edge\nbeam.add(facet([[0, -1.55], [0, -2.1], [-0.05, -2.1], [-0.29, -1.7]], [BT, 0.018, 0.018, BT], 0, knife, steelV));\n// inside-measuring blade: wide and short, measuring face on its left, bevelled top\nbeam.add(prism([[ID_FACE, 0.30], [-0.14, 0.30], [-0.14, 0.40], [ID_FACE, 0.68]], -0.05, 0.05, steelV, 0.004));\nbeam.add(facet([[ID_FACE, 0.68], [-0.14, 0.40], [-0.14, 0.52], [-0.47, 0.82], [ID_FACE, 0.82]], [0.05, 0.05, 0.012, 0.012, 0.012], 0, knife, steelV));\n\n// gear rack in the channel: teeth point up toward the dial pinion\n(function rack() {\n  const x0 = 0.47, x1 = 8.08, p = 0.0314;\n  const s = new THREE.Shape(); s.moveTo(x0, 0.085); s.lineTo(x0, 0.15);\n  let x = x0;\n  while (x + p \u003c= x1) {\n    s.lineTo(x + p * 0.2, 0.176); s.lineTo(x + p * 0.5, 0.176); s.lineTo(x + p * 0.7, 0.15); s.lineTo(x + p, 0.15);\n    x += p;\n  }\n  s.lineTo(x, 0.085);\n  const g = new THREE.ExtrudeGeometry(s, { depth: 0.028, bevelEnabled: false, curveSegments: 1 });\n  g.translate(0, 0, 0.02);\n  beamDial.add(mesh(g, rackMat));\n})();\nbeamDial.add(box(0.25, 0.47, 0.075, 0.245, 0.02, 0.058, steel, 0.004));\nbeamDial.add(screw(0.36, 0.16, 0.058, 0.04));\n// end plate\nbeam.add(box(8.42, 8.7, -0.14, 0.31, BT, BT + 0.03, steel, 0.006));\nbeam.add(screw(8.5, 0.22, BT + 0.03, 0.035));\nbeam.add(screw(8.62, -0.06, BT + 0.03, 0.035));\n\n// engraved scale + lettering\n(function scaleDecal() {\n  const S = 420, H = 0.38, W = XR - XL;\n  const c = document.createElement('canvas'); c.width = Math.round(W * S); c.height = Math.round(H * S);\n  const g = c.getContext('2d');\n  const bx = x => (x - XL) * S, by = y => (0.07 - y) * S;\n  g.fillStyle = 'rgba(14,15,17,0.96)';\n  g.fillRect(bx(-0.08), by(-0.103), (6.12 + 0.08) * S, 0.006 * S);\n  for (let i = 0; i \u003c= 60; i++) {\     const st = it.el.style, left = r.x + r.w/2 \u003c W/2, topSide = r.y + r.h/2 \u003c H/2;\n    st.left = Math.round(r.x) + 'px'; st.top = Math.round(r.y) + 'px'; st.right = 'auto'; st.bottom = 'auto';\n    it.el.classList.add('ov');\n    it.el.classList.toggle('ov-left', left); it.el.classList.toggle('ov-right', !left);\n    it.el.classList.toggle('ov-top', topSide); it.el.classList.toggle('ov-bottom', !topSide);\n    it.r = r; it.topSide = topSide;\n  }\n  OVL.rects = result.filter(o => !o.it.el.classList.contains('ov-hide')).map(o => o.r);\n  const tops = result.filter(o => o.it.topSide).map(o => o.r), bots = result.filter(o => !o.it.topSide).map(o => o.r);\n  const coach = wrap.querySelector('.coach'), toastEl = $('toast');\n  const cw = Math.min(420, W - 32), cx = (W - cw)/2;\n  const under = tops.filter(r => r.x \u003c cx + cw && cx \u003c r.x + r.w).reduce((m, r) => Math.max(m, r.y + r.h), pad);\n  coach.style.top = Math.round(under + gap) + 'px';\n  const tw = Math.min(W*0.7, toastEl.offsetWidth || 260), tx = (W - tw)/2;\n  const above = bots.filter(r => r.x \u003c tx + tw && tx \u003c r.x + r.w).reduce((m, r) => Math.min(m, r.y), H - pad);\n  toastEl.style.bottom = Math.round(H - above + gap) + 'px';\n  OVL.busy = false;\n}\n/* On a phone the flat view would cover the model, and shrinking it far enough to fit\n   makes the scales unreadable — so below 700px it moves out into its own dock under\n   the 3D view at full size. Out of #view it drops out of OV_ITEMS on its own. */\nfunction placeFlat(){\n  const el = $('flat'), dock = $('flatDock');\n  const home = window.matchMedia('(max-width:700px)').matches ? dock : wrap;\n  if (el.parentElement === home) return;\n  home.appendChild(el);\n  const docked = home === dock;\n  el.classList.toggle('docked', docked);\n  if (docked){\n    el.classList.remove('ov', 'ov-min', 'ov-hide', 'ov-left', 'ov-right', 'ov-top', 'ov-bottom');\n    el.style.left = el.style.top = el.style.maxWidth = '';\n    const cv = $('flatCv'); cv.style.width = cv.style.height = '';\n  }\n  flatKey = '';\n}\nfunction queueLayout(){\n  if (OVL.queued) return;\n  OVL.queued = true;\n  // a timer backs up the frame callback, which never fires while the page is not being painted\n  const run = () => { if (!OVL.queued) return; OVL.queued = false; placeFlat(); layoutOverlays(); };\n  requestAnimationFrame(run); setTimeout(run, 80);\n}\n\n/* ---------- resizable reading panel ---------- */\nconst RH = { normal: 132, practice: 380 };\nfunction applyRH(){\n  const main = document.querySelector('main');\n  const max = Math.max(120, main.clientHeight - 220);\n  const k = state.practice ? 'practice' : 'normal';\n  RH[k] = Math.max(96, Math.min(max, RH[k]));\n  $('reading').style.setProperty('--rh', RH[k] + 'px');\n  $('split').setAttribute('aria-valuenow', String(Math.round(RH[k])));\n  $('split').setAttribute('aria-valuemin', '96');\n  $('split').setAttribute('aria-valuemax', String(Math.round(max)));\n}\nfunction bindSplit(){\n  const sp = $('split');\n  let dragging = null;\n  sp.addEventListener('pointerdown', e => {\n    dragging = { y: e.clientY, h: RH[state.practice ? 'practice' : 'normal'] };\n    sp.setPointerCapture(e.pointerId); sp.classList.add('drag'); document.body.classList.add('resizing');\n    e.preventDefault();\n  });\n  sp.addEventListener('pointermove', e => {\n    if (!dragging) return;\n    RH[state.practice ? 'practice' : 'normal'] = dragging.h - (e.clientY - dragging.y);\n    applyRH();\n  });\n  const end = e => { if (!dragging) return; dragging = null; sp.classList.remove('drag'); document.body.classList.remove('resizing'); try { sp.releasePointerCapture(e.pointerId); } catch (err) {} };\n  sp.addEventListener('pointerup', e => { if (dragging && state.practice) rhPracticeSet = true; end(e); }); sp.addEventListener('pointercancel', end);\n  sp.addEventListener('dblclick', () => { RH[state.practice ? 'practice' : 'normal'] = state.practice ? 380 : 132; applyRH(); });\n  sp.addEventListener('keydown', e => {\n    const k = state.practice ? 'practice' : 'normal';\n    if (e.key === 'ArrowUp'){ RH[k] += e.shiftKey ? 64 : 16; applyRH(); e.preventDefault(); e.stopPropagation(); }\n    else if (e.key === 'ArrowDown'){ RH[k] -= e.shiftKey ? 64 : 16; applyRH(); e.preventDefault(); e.stopPropagation(); }\n  });\n  window.addEventListener('resize', applyRH);\n}\n\n/* ================================================================== reading math */\nconst HLC = { inch: cssVar('--hl-inch'), tenth: cssVar('--hl-tenth'), dial: cssVar('--hl-dial'), bezel: cssVar('--hl-bezel'), sub: cssVar('--hl-sub'), vern: cssVar('--hl-vern') };\nconst isVern = () => state.inst === 'vern';\nconst TOOL = {\n  od:    { name: 'Outside jaws', c: '#ff8a3d' },\n  id:    { name: 'Inside jaws',  c: '#a78bfa' },\n  depth: { name: 'Depth rod',    c: '#2dd4bf' }\n};\n// the vernier has no bezel: its zero is engraved, so the offset only exists on the dial caliper\nfunction bezelOffset() { if (isVern()) return 0; const b = state.bezel / TAU * 0.1; return b - 0.1 * Math.round(b / 0.1); }\nconst indicated = () => state.pos + bezelOffset();\n// split a reading in thousandths into what the scales show.\n// dial: inch + tenth + dial.  vernier: inch + tenth + sub (0.025″ lines past the tenth) + vern.\nfunction split(n) {\n  n = Math.max(0, n);\n  const rem = n % 100;\n  return { inch: Math.floor(n / 1000), tenth: Math.floor(n / 100) % 10, rem, dial: rem, sub: Math.floor(rem / 25), vern: rem % 25 };\n}\nconst stepKeys = () => isVern() ? ['inch', 'tenth', 'sub', 'vern'] : ['inch', 'tenth', 'dial'];\nconst f3 = v => (v \u003c 0 ? '−' : '') + Math.abs(v).toFixed(3);\nconst esc = s => String(s).replace(/[&\u003c>\"]/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n/* ================================================================== 3D highlights */\nfunction hlMat(c) {\n  return new T.MeshBasicMaterial({ color: new T.Color(c), toneMapped: false, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -8, polygonOffsetUnits: -8 });\n}\nfunction outlineGeo(w, h, t) {\n  const s = new T.Shape([new T.Vector2(-w / 2, -h / 2), new T.Vector2(w / 2, -h / 2), new T.Vector2(w / 2, h / 2), new T.Vector2(-w / 2, h / 2)]);\n  s.holes.push(new T.Path([new T.Vector2(-w / 2 + t, -h / 2 + t), new T.Vector2(-w / 2 + t, h / 2 - t), new T.Vector2(w / 2 - t, h / 2 - t), new T.Vector2(w / 2 - t, -h / 2 + t)]));\n  return new T.ShapeGeometry(s);\n}\nconst HL3 = {\n  inchBox: new T.Mesh(outlineGeo(0.12, 0.17, 0.014), hlMat(HLC.inch)),\n  tenthTick: new T.Mesh(new T.PlaneGeometry(0.02, 0.2), hlMat(HLC.tenth)),\n  tenthBox: new T.Mesh(outlineGeo(0.085, 0.13, 0.011), hlMat(HLC.tenth)),\n  dialTick: new T.Mesh(new T.PlaneGeometry(0.016, 0.13), hlMat(HLC.dial)),\n  dialDot: new T.Mesh(new T.CircleGeometry(0.03, 24), hlMat(HLC.dial))\n};\nObject.values(HL3).forEach(m => { m.renderOrder = 5; m.visible = false; });\nbeamDial.add(HL3.inchBox, HL3.tenthTick, HL3.tenthBox);\nbezel.add(HL3.dialTick, HL3.dialDot);\n// vernier highlights: beam-side marks live on the beam, the aligned vernier line rides the slider\nconst HLV = {\n  inchBox: new T.Mesh(outlineGeo(0.15, 0.165, 0.014), hlMat(HLC.inch)),\n  tenthTick: new T.Mesh(new T.PlaneGeometry(0.014, 1), hlMat(HLC.tenth)),\n  tenthBox: new T.Mesh(outlineGeo(0.085, 0.1, 0.011), hlMat(HLC.tenth)),\n  subTick: new T.Mesh(new T.PlaneGeometry(0.014, 1), hlMat(HLC.sub)),\n  vernTick: new T.Mesh(new T.PlaneGeometry(0.014, 0.085), hlMat(HLC.vern)),\n  vernBeam: new T.Mesh(new T.PlaneGeometry(0.014, 0.05), hlMat(HLC.vern))\n};\nObject.values(HLV).forEach(m => { m.renderOrder = 5; m.visible = false; });\nbeamVern.add(HLV.inchBox, HLV.tenthTick, HLV.tenthBox, HLV.subTick, HLV.vernBeam);\nsliderVern.add(HLV.vernTick);\n// a tick from the vernier edge up to the top of beam line i\nfunction beamTick(m, i, x) {\n  const top = vLineTop(i), h = top - VEDGE;\n  m.scale.y = h; m.position.set(x, VEDGE + h / 2, BT dialDot.visible = false;\n}\n\n/* ================================================================== parts */\nlet sample = { type: 'none', tool: null, size: 0, obj: null };\nconst rnd = (a, b) => Math.round((a + Math.random() * (b - a)) * 1000) / 1000;\nconst hullMats = {};\nfunction hullMat(tool) {\n  return hullMats[tool] || (hullMats[tool] = new T.ShaderMaterial({\n    uniforms: { c: { value: new T.Color(TOOL[tool].c) }, w: { value: 0.016 } },\n    vertexShader: 'uniform float w;\\n#include \u003cclipping_planes_pars_vertex>\\nvoid main(){ vec3 p = position + normalize(normal)*w; vec4 mvPosition = modelViewMatrix*vec4(p,1.0); gl_Position = projectionMatrix*mvPosition;\\n#include \u003cclipping_planes_vertex>\\n}',\n    fragmentShader: 'uniform vec3 c;\\n#include \u003cclipping_planes_pars_fragment>\\nvoid main(){\\n#include \u003cclipping_planes_fragment>\\ngl_FragColor = vec4(c,1.0); }',\n    side: T.BackSide, clipping: true, clippingPlanes: secPlanes()\n  }));\n}\nfunction buildSample(type) {\n  if (sample.obj) { cal.remove(sample.obj); sample.obj.traverse(o => o.geometry && o.geometry.dispose()); }\n  sample = { type, tool: null, size: 0, obj: null };\n  const def = PARTS[type];\n  if (!def) { refreshPartCard(); return; }\n  const size = rnd(...def.range);\n  const { obj, ext } = def.build(size);\n  // a part made of several pieces is merged into one solid (one mesh, one finish)\n  {\n    const solids = []; obj.updateMatrixWorld(true);\n    obj.traverse(o => { if (o.isMesh && !o.material.transparent) solids.push(o); });\n    if (solids.length > 1){\n      const geos = solids.map(o => { const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone()).applyMatrix4(o.matrixWorld);\n        Object.keys(g.attributes).forEach(k => { if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k); });\n        if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2), 2));\n        re {id:"micrometer",name:"Outside micrometer",html:"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Vernier Micrometer · 3D\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#0d0e10; --panel:#131416; --raise:#1b1d20; --raise-2:#24272b; --ink:#ececee; --muted:#8a8f97;\n  --line:#222428; --accent:#5b93ea; --accent-ink:#0b1320; --ok:#5fcf8a; --warn:#ff7a6e;\n  --hl-num:#ffd43b; --hl-line:#ff4d4d; --hl-thimble:#3d8bff; --hl-vernier:#2fd36b;\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){ --bg:#0d0e10; } }\n:root[data-theme=\"dark\"]{ --bg:#0d0e10; }\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--bg);color:var(--ink);font-family:\"Inter\",system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:\"tnum\" 1,\"cv11\" 1}\n.app{display:grid;grid-template-columns:310px minmax(0,1fr);grid-template-areas:\"side main\";height:100vh;height:100dvh}\naside{grid-area:side;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 18px 28px;transition:filter .25s}\n.logo{padding:6px 0 2px;text-align:center}\n.logo-mark{margin:0;font-family:'Bebas Neue','Inter',sans-serif;font-size:2.35rem;font-weight:400;letter-spacing:.055em;line-height:.9;color:#e4e6ea;display:flex;align-items:center;justify-content:center;gap:.28em}\n.logo-stack{display:flex;flex-direction:column;align-items:center;gap:.06em}\n.logo-top{display:block;white-space:nowrap}\n.logo-bot{display:block;font-style:italic;text-tr height:100%;background:var(--accent);border-radius:inherit;transform:scaleX(0);transform-origin:left;transition:transform .25s ease-out}\n.loading .ld-p{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}\n.loading{transition:opacity .3s}\n.loading.ld-out{opacity:0;pointer-events:none}\n@media (prefers-reduced-motion: reduce){ .loading,.loading .ld-bar i{transition:none} }\n.coach{position:absolute;left:50%;top:56px;transform:translate(-50%,-8px);width:min(640px,calc(100% - 32px));background:#0b0c0e;border:1px solid var(--accent);border-radius:10px;padding:14px 16px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}\nbody.coaching .coach{opacity:1;transform:translate(-50%,0);pointer-events:auto}\n.coach h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--accent)}\n.coach p{margin:0 0 10px;color:#c9ccd1;font-size:13px}\n.coach p .ln{display:block}\n.coach p .ln + .ln{margin-top:4px}\n.coach p u{text-decoration:underline;text-decoration-color:var(--ok);text-decoration-thickness:2px;text-underline-offset:3px}\nbody.coaching aside, body.coaching .reading, body.coaching .views, body.coaching .actions, body.coaching .legend, body.coaching .flat, body.coaching .quick{filter:brightness(.3)}\n\n.reading{flex:0 0 auto;height:var(--rh,132px);overflow:hidden;background:var(--panel);border-top:1px solid var(--line);padding:14px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 26px;align-items:center;transition:filter .25s}\n.value .num{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}\n.value .unit{font-size:16px;color:var(--muted);font-weight:500;margin-left:4px}\n.value .mm{display:block;color:var(--muted);font-size:13px;margin-top:4px}\n.status{font-size:13px;font-weight:500;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:7px;max-width:260px}\n.status::before{content:\"\";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}\n.status.ok{color
